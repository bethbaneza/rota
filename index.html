const REL={per:"mes",de:"",ate:"",rep:"",st:"realizada",aba:"resumo",csv:null};
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const segundaDe=iso=>{const d=new Date(iso+"T12:00:00");return somaDias(iso,-((d.getDay()+6)%7));};
function periodoRel(){
  const hoje=hojeISO(),[Y,M]=hoje.split("-").map(Number);
  const fimMes=(y,m)=>isoLocal(new Date(y,m,0));
  switch(REL.per){
    case"semana":{const s=segundaDe(hoje);return[s,somaDias(s,6),"Esta semana"];}
    case"semana_ant":{const s=somaDias(segundaDe(hoje),-7);return[s,somaDias(s,6),"Semana passada"];}
    case"mes":return[`${Y}-${String(M).padStart(2,"0")}-01`,fimMes(Y,M),"Este mês"];
    case"mes_ant":{const d=new Date(Y,M-2,1);return[isoLocal(d),fimMes(d.getFullYear(),d.getMonth()+1),"Mês passado"];}
    case"30":return[somaDias(hoje,-29),hoje,"Últimos 30 dias"];
    case"90":return[somaDias(hoje,-89),hoje,"Últimos 90 dias"];
    case"ano":return[`${Y}-01-01`,`${Y}-12-31`,"Este ano"];
    case"tudo":{const ds=S.visitas.map(x=>x.data).sort();return[ds[0]||hoje,ds[ds.length-1]||hoje,"Todo o período"];}
    default:{const de=REL.de||hoje,ate=REL.ate||hoje;return[de<=ate?de:ate,de<=ate?ate:de,"Período escolhido"];}
  }
}
const rotMes=k=>{const[a,m]=k.split("-");return MESES[+m-1].slice(0,3)+"/"+a.slice(2);};
const nomeRepVis=x=>(x.representadas||[]).map(repNome).filter(Boolean);
const eh=(x,s)=>x.status===s;
const pedido=x=>x.status==="realizada"&&x.resultado==="Pedido fechado";

function dadosRel(){
  const[de,ate,rotulo]=periodoRel();
  const base=S.visitas.filter(x=>x.data>=de&&x.data<=ate&&(!REL.rep||(x.representadas||[]).includes(REL.rep)));
  const vis=REL.st==="todas"?base:base.filter(x=>x.status===REL.st);
  return{de,ate,rotulo,base,vis};
}
const distintos=l=>new Set(l.map(x=>x.cliente_id)).size;
function resumoDe(l){
  const r=l.filter(x=>eh(x,"realizada")),c=l.filter(x=>eh(x,"cancelada")),a=l.filter(x=>eh(x,"agendada")),p=r.filter(pedido);
  return{total:l.length,real:r.length,canc:c.length,agend:a.length,pedidos:p.length,neg:r.filter(x=>x.resultado==="Pedido em negociação").length,clientes:distintos(r),min:r.reduce((s,x)=>s+(x.duracao_min||0),0)};
}
// soma das vendas e comissão estimada (valor × % da empresa). soRep = só uma empresa; sem % cadastrado = sem comissão calculada
function vendasDe(l,soRep){
  let valor=0,com=0,semCom=false,n=0;
  l.forEach(x=>{
    if(x.status!=="realizada")return;
    Object.entries(x.vendas||{}).forEach(([k,v])=>{
      if(soRep&&k!==soRep)return;if(REL.rep&&k!==REL.rep)return;
      const val=+v||0;if(val<=0)return;
      valor+=val;n++;
      const c=comRep(k);if(c==null)semCom=true;else com+=val*c/100;
    });
  });
  return{valor,com,semCom,n};
}
const pct=(a,b)=>b?Math.round(a/b*100)+"%":"—";

function barras(itens,max){
  const m=max||Math.max(1,...itens.map(i=>i[1]));
  return `<div class="bars">${itens.map(([rot,val,extra])=>`<div class="bar"><span class="bl">${esc(rot)}</span><span class="bt"><i style="width:${Math.round(val/m*100)}%"></i></span><span class="bv">${extra!=null?esc(extra):val}</span></div>`).join("")}</div>`;
}
function tabelaRel(cols,linhas,nome){
  REL.csv={nome,cols,linhas};
  return `<div class="tblwrap"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${linhas.length?linhas.map(l=>`<tr>${l.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${cols.length}" style="color:var(--n-500)">Nenhuma visita neste período.</td></tr>`}</tbody></table></div>`;
}

    </div></div>
    <h1 class="onlyprint" style="margin-bottom:6px">Banheza Rota · Relatório de visitas</h1>
    <div class="relcab">${esc(d.rotulo)}: ${esc(dataCurta(d.de))}${d.de.slice(0,4)!==d.ate.slice(0,4)?"/"+d.de.slice(0,4):""} a ${esc(dataCurta(d.ate))}/${esc(d.ate.slice(0,4))}${REL.rep?" · "+esc(repNome(REL.rep)):" · todas as empresas"}</div>
    <div class="tabs noprint">${ABAS.map(([k,t])=>`<button class="chip ${REL.aba===k?"on":""}" data-a="${k}">${t}</button>`).join("")}</div>
    <div id="relcorpo"></div>`;
  const q=s=>v.querySelector(s);
  const redesenha=()=>telaRelatorios(v);
  q("#rf_per").onchange=e=>{REL.per=e.target.value;redesenha();};
  q("#rf_de")&&(q("#rf_de").onchange=e=>{REL.de=e.target.value;redesenha();});
  q("#rf_ate")&&(q("#rf_ate").onchange=e=>{REL.ate=e.target.value;redesenha();});
  q("#rf_rep").onchange=e=>{REL.rep=e.target.value;redesenha();};
  q("#rf_st").onchange=e=>{REL.st=e.target.value;redesenha();};
  v.querySelectorAll(".tabs [data-a]").forEach(b=>b.onclick=()=>{REL.aba=b.dataset.a;redesenha();});
  q("#rimp").onclick=()=>window.print();
  q("#rcsv").onclick=()=>exportaRel();
  corpoRel(q("#relcorpo"),d);
}

function corpoRel(box,d){
  const{vis,base}=d,R_=resumoDe(vis);
  let html="";
  const aviso=vd=>vd.semCom?`<div class="msg warn" style="margin-top:12px">Há vendas de empresas sem comissão cadastrada, que não entram na comissão estimada. Defina o percentual em <a href="#/representadas">Representadas</a>.</div>`:"";
  if(REL.aba==="resumo"){
    const todas=resumoDe(base),vd=vendasDe(vis);
    const porRes={};vis.filter(x=>eh(x,"realizada")).forEach(x=>{const k=x.resultado||"Sem resultado";porRes[k]=(porRes[k]||0)+1;});
    const meses={};vis.forEach(x=>{const k=x.data.slice(0,7);meses[k]=(meses[k]||0)+1;});
    const ordM=Object.keys(meses).sort();
    const porRep={};vis.forEach(x=>{const n=nomeRepVis(x);(n.length?n:["Sem empresa"]).forEach(k=>{porRep[k]=(porRep[k]||0)+1;});});
    const vendasRep=S.reps.map(r=>[r.nome,vendasDe(vis,r.id)]).filter(([,s])=>s.valor>0).sort((a,b)=>b[1].valor-a[1].valor);
    html=`<div class="kpis4"><div class="kpi"><b>${REL.st==="realizada"?R_.real:R_.total}</b><span>${REL.st==="realizada"?"Visitas realizadas":"Visitas no período"}</span></div><div class="kpi"><b>${R_.clientes}</b><span>Clientes diferentes visitados</span></div><div class="kpi"><b>${R_.pedidos}</b><span>Pedidos fechados</span></div><div class="kpi"><b>${pct(R_.pedidos,R_.real)}</b><span>Pedidos por visita realizada</span></div></div>
      <div class="kpis4"><div class="kpi"><b>R$ ${money(vd.valor)}</b><span>Vendas no período (sem frete e instalação)</span></div><div class="kpi"><b>R$ ${money(vd.com)}</b><span>Comissão estimada</span></div><div class="kpi"><b>${vd.n}</b><span>Vendas lançadas</span></div><div class="kpi"><b>${vd.n?"R$ "+money(vd.valor/vd.n):"—"}</b><span>Venda média</span></div></div>
      ${aviso(vd)}
      <div class="kpis4" style="margin-top:16px"><div class="kpi"><b>${todas.real}</b><span>Realizadas (todas as empresas do filtro)</span></div><div class="kpi"><b>${todas.agend}</b><span>Ainda agendadas</span></div><div class="kpi"><b>${todas.canc}</b><span>Canceladas</span></div><div class="kpi"><b>${pct(todas.real,todas.real+todas.canc)}</b><span>Realizadas entre realizadas + canceladas</span></div></div>
      <div class="dash">
        <section class="card"><h2>Resultado das visitas realizadas</h2>${Object.keys(porRes).length?barras(Object.entries(porRes).sort((a,b)=>b[1]-a[1])):`<p style="margin:0">Nenhuma visita realizada no período.</p>`}</section>
        <section class="card"><h2>Vendas por empresa (R$)</h2>${vendasRep.length?barras(vendasRep.map(([n,s])=>[n,s.valor,"R$ "+money(s.valor)])):`<p style="margin:0">Nenhuma venda lançada no período. O valor é informado ao concluir a visita (opcional).</p>`}</section>
        <section class="card"><h2>Visitas por empresa</h2>${Object.keys(porRep).length?barras(Object.entries(porRep).sort((a,b)=>b[1]-a[1])):`<p style="margin:0">Sem dados no período.</p>`}<p class="lead" style="margin:10px 0 0;font-size:12px">Uma visita em nome de duas empresas conta nas duas linhas.</p></section>
        ${ordM.length>1?`<section class="card"><h2>Visitas por mês</h2>${barras(ordM.map(k=>[rotMes(k),meses[k]]))}</section>`:""}
      </div>`;
    REL.csv=null;
  }else if(REL.aba==="empresa"){
    const linhas=S.reps.map(r=>[r.nome,vis.filter(x=>(x.representadas||[]).includes(r.id)),r.id,r.comissao]);
    const sem=vis.filter(x=>!(x.representadas||[]).length);
    if(sem.length)linhas.push(["Sem empresa",sem,"_",null]);
    let totCom=0,semCom=false;
    const rows=linhas.map(([n,l,id,cm])=>{const s=resumoDe(l),vd=vendasDe(l,id);totCom+=vd.com;if(vd.semCom)semCom=true;
      return[n,s.real,s.pedidos,s.neg,s.agend,s.canc,s.clientes,pct(s.pedidos,s.real),money(vd.valor),cm!=null?String(cm).replace(".",",")+"%":"—",cm!=null?money(vd.com):"—"];}).sort((a,b)=>b[1]-a[1]);
    html=`<section class="card"><h2>Visitas por empresa representada</h2>${barras(rows.map(r=>[r[0],r[1]]))}</section>`
      +tabelaRel(["Empresa","Realizadas","Pedidos fechados","Em negociação","Agendadas","Canceladas","Clientes visitados","Pedidos por visita","Vendas (R$)","Comissão (%)","Comissão estimada (R$)"],rows,"visitas-por-empresa")
      +`<div class="kpis4" style="margin-top:16px"><div class="kpi"><b>R$ ${money(totCom)}</b><span>Comissão estimada (soma das empresas)</span></div></div>`
      +(semCom?`<div class="msg warn">Há vendas de empresas sem comissão cadastrada. Defina o percentual em <a href="#/representadas">Representadas</a>.</div>`:"")
      +`<p class="lead" style="margin-top:10px;font-size:12px">Uma visita em nome de duas empresas aparece nas duas linhas; o total geral do Resumo conta uma vez só. A comissão é uma estimativa: valor vendido × percentual combinado com cada empresa.</p>`;
  }else if(REL.aba==="mes"){
    const g={};vis.forEach(x=>{const k=x.data.slice(0,7);(g[k]=g[k]||[]).push(x);});
    const ks=Object.keys(g).sort();
    const rows=ks.map(k=>{const s=resumoDe(g[k]),vd=vendasDe(g[k]);return[rotMes(k),s.real,s.pedidos,s.agend,s.canc,s.clientes,pct(s.pedidos,s.real),money(vd.valor),money(vd.com)];});
    html=(ks.length?`<section class="card"><h2>Visitas por mês</h2>${barras(ks.map(k=>[rotMes(k),g[k].length]))}</section>`:"")+tabelaRel(["Mês","Realizadas","Pedidos fechados","Agendadas","Canceladas","Clientes visitados","Pedidos por visita","Vendas (R$)","Comissão estimada (R$)"],rows,"visitas-por-mes");
  }else if(REL.aba==="semana"){
    const g={};vis.forEach(x=>{const k=segundaDe(x.data);(g[k]=g[k]||[]).push(x);});
    const ks=Object.keys(g).sort();
    const rows=ks.map(k=>{const s=resumoDe(g[k]),vd=vendasDe(g[k]);return[dataCurta(k)+" a "+dataCurta(somaDias(k,6)),s.real,s.pedidos,s.agend,s.canc,s.clientes,pct(s.pedidos,s.real),money(vd.valor),money(vd.com)];});
    html=(ks.length?`<section class="card"><h2>Visitas por semana</h2>${barras(ks.map(k=>[dataCurta(k)+" a "+dataCurta(somaDias(k,6)),g[k].length]))}</section>`:"")+tabelaRel(["Semana (segunda a domingo)","Realizadas","Pedidos fechados","Agendadas","Canceladas","Clientes visitados","Pedidos por visita","Vendas (R$)","Comissão estimada (R$)"],rows,"visitas-por-semana");
  }else if(REL.aba==="cliente"){
    const g={};vis.forEach(x=>{(g[x.cliente_id]=g[x.cliente_id]||[]).push(x);});
    const rows=Object.entries(g).map(([id,l])=>{const c=cliPorId(id),s=resumoDe(l),vd=vendasDe(l);const ult=l.filter(x=>eh(x,"realizada")).sort((a,b)=>b.data.localeCompare(a.data))[0];
      const reps=[...new Set(l.flatMap(nomeRepVis))].join(", ");
      return[c?nomeCli(c):"Cliente removido",c?[c.cidade,c.uf].filter(Boolean).join("/"):"",reps,s.real,s.pedidos,money(vd.valor),ult?dataCurta(ult.data)+"/"+ult.data.slice(0,4):"—"];}).sort((a,b)=>b[3]-a[3]||a[0].localeCompare(b[0],"pt-BR"));
    const visitados=new Set(Object.keys(g));
    const sem=S.clientes.filter(c=>c.ativo&&!visitados.has(c.id)).sort((a,b)=>nomeCli(a).localeCompare(nomeCli(b),"pt-BR"));
    html=tabelaRel(["Cliente","Cidade","Empresas","Realizadas","Pedidos fechados","Vendas (R$)","Última visita"],rows,"visitas-por-cliente")
      +`<section class="card" style="margin-top:16px"><h2>Clientes sem nenhuma visita neste período (${sem.length})</h2>${sem.length?`<p style="margin:0">${sem.slice(0,60).map(c=>`<a href="#/clientes/${esc(c.id)}">${esc(nomeCli(c))}</a>`).join(" · ")}${sem.length>60?` · e mais ${sem.length-60}…`:""}</p>`:`<p style="margin:0">Todos os clientes tiveram visita no período.</p>`}</section>`;
  }else{
    const l=[...vis].sort((a,b)=>chaveVis(b).localeCompare(chaveVis(a)));
    const rows=l.map(x=>{const c=cliPorId(x.cliente_id);return[dataCurta(x.data)+"/"+x.data.slice(0,4),hhmm(x.hora)||"",c?nomeCli(c):"Cliente removido",nomeRepVis(x).join(", "),STATUS_VIS[x.status]?STATUS_VIS[x.status][1]:x.status,x.resultado||"",textoVendas(x),x.assunto||"",(x.notas||"").replace(/\s+/g," ")];});
    html=tabelaRel(["Data","Hora","Cliente","Empresas","Situação","Resultado","Vendas","Assunto","Anotações"],rows,"visitas-lista");
  }
  box.innerHTML=html;
}

function exportaRel(){
  if(!REL.csv)return toast("Escolha uma aba com tabela (Por empresa, mês, semana, cliente ou Visitas) para exportar.");
  const[de,ate]=periodoRel();
  const cel=c=>{const s=String(c==null?"":c).replace(/"/g,'""');return /[";\n\r]/.test(s)?`"${s}"`:s;};
  const txt=String.fromCharCode(65279)+[REL.csv.cols,...REL.csv.linhas].map(l=>l.map(cel).join(";")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));
  a.download=`rota-${REL.csv.nome}-${de}-a-${ate}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href);},0);
  toast("Planilha gerada.");
}

/* ===================== inicialização ===================== */
async function iniciar(){
  if(!window.supabase){telaAuth("entrar");return aviso("Não foi possível carregar o aplicativo. Verifique a internet e recarregue a página.");}
  supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  $("#a-form").addEventListener("submit",enviarAuth);
  $("#b-mode").onclick=()=>telaAuth(modoAuth==="criar"?"entrar":"criar");
  $("#b-forgot").onclick=esqueci;
  $("#b-sair").onclick=sair;
  supa.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY")telaAuth("nova");});
  // veio do link "esqueci a senha": mostra a tela de senha nova em vez de abrir o app
  if(/type=recovery/.test(location.hash+location.search)){telaAuth("nova");return;}
  const{data}=await supa.auth.getSession();
  if(data&&data.session)abrirApp(data.session.user);else telaAuth("entrar");
}
if(!window.__ROTA_TESTE)iniciar();
</script>
