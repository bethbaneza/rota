<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#002820">
<meta name="description" content="Banheza Rota — cadastro de clientes e o melhor trajeto para as suas visitas.">
<title>Banheza Rota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap">
<style>
:root{
  /* tokens da marca Banheza (design system) — identidade verde, como o Assist */
  --green-900:#002820;--green-800:#003020;--green-700:#003828;--green-500:#008048;--green-400:#00c868;--green-300:#3ed87f;--green-200:#58e888;--green-100:#d5f7e3;
  --navy-900:#001030;
  --white:#fff;--n-50:#f5f7fa;--n-100:#e9edf3;--n-200:#d6dde7;--n-300:#b9c4d2;--n-400:#8a97a8;--n-500:#5d6a7e;--n-600:#3f4a5e;--n-700:#2a3247;
  --danger:#e2453c;--danger-soft:#fdeceb;--warn:#f2a71b;--warn-soft:#fff4dc;
  --grad-assist:linear-gradient(180deg,var(--green-900) 0%,var(--green-700) 55%,var(--green-500) 100%);
  --display:"Exo 2",system-ui,sans-serif;--font:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-field:14px;--r-card:20px;--ease:cubic-bezier(.2,.6,.2,1);
  --nav-h:64px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--n-50);color:var(--n-700);font:400 15px/1.55 var(--font);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.2;letter-spacing:-.01em;color:var(--navy-900);margin:0;text-wrap:balance}
[hidden]{display:none!important}
a{color:var(--green-500)}
button{font-family:inherit}
:focus-visible{outline:3px solid rgba(0,144,248,.35);outline-offset:2px}
.ic{display:inline-block;width:20px;height:20px;background:currentColor;-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat;flex:none;vertical-align:middle}
.ic.sm{width:16px;height:16px}

/* logotipo */
.lockup{display:flex;align-items:center;gap:12px}
.lockup img.mk{width:40px;height:40px;object-fit:contain}
.lockup .wm{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.lockup .wm img{height:15px;width:auto;display:block}
.lockup .wm span{font:600 9.5px/1 var(--display);letter-spacing:.34em;margin-right:-.34em;color:var(--green-200);margin-top:6px}
.lockup.sm img.mk{width:30px;height:30px}.lockup.sm .wm img{height:12px}.lockup.sm .wm span{font-size:8px;margin-top:5px}

/* ---------- login ---------- */
.auth{min-height:100vh;min-height:100dvh;background:var(--grad-assist);color:var(--white);display:flex;flex-direction:column}
.auth .in{width:100%;max-width:440px;margin:0 auto;padding:max(56px,env(safe-area-inset-top)) 28px 24px;flex:1}
.auth .lockup{margin-bottom:44px}
.auth h1{color:var(--white);font-size:26px;margin-bottom:6px}
.auth .sub{margin:0 0 26px;color:rgba(255,255,255,.74)}
.afield{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.afield label{font:500 13px/1.2 var(--font);color:rgba(255,255,255,.86)}
.afield input{height:50px;border-radius:var(--r-field);border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:var(--white);padding:0 16px;font:400 15px var(--font);width:100%}
.afield input::placeholder{color:rgba(255,255,255,.5)}
.afield input:focus{outline:none;border-color:var(--green-200);box-shadow:0 0 0 3px rgba(88,232,136,.22)}
.linkrow{display:flex;justify-content:space-between;margin:-4px 0 18px;font:500 13px var(--font)}
.linkrow button{background:none;border:0;padding:8px 0;color:var(--green-200);font:inherit;cursor:pointer;min-height:44px}
.auth .foot{padding:0 28px max(28px,env(safe-area-inset-bottom));text-align:center;font:400 12px var(--font);color:rgba(255,255,255,.7)}
.msg{border-radius:12px;padding:12px 14px;margin:0 0 16px;font:500 13.5px/1.45 var(--font)}
.msg.err{background:var(--danger-soft);color:#8a1f18}
.msg.ok{background:var(--green-100);color:#00331f}
.msg.warn{background:var(--warn-soft);color:#6b4600}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:var(--r-field);border:1px solid transparent;font:600 14.5px var(--font);cursor:pointer;transition:transform .12s var(--ease),background .2s var(--ease);text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.block{width:100%}
.btn.primary{background:var(--green-400);color:#002018;box-shadow:0 6px 16px rgba(0,128,72,.25)}
.btn.primary:hover{background:var(--green-300);transform:translateY(-1px)}
.btn.sec{background:var(--white);color:var(--navy-900);border-color:var(--n-200)}
.btn.sec:hover{background:var(--n-100)}
.btn.danger{background:var(--white);color:var(--danger);border-color:#f2c4c1}
.btn.danger:hover{background:var(--danger-soft)}
.btn.sm{height:40px;padding:0 14px;font-size:13px}
.btn.ghostw{background:transparent;color:var(--white);border-color:rgba(255,255,255,.3)}
.btn.ghostw:hover{background:rgba(255,255,255,.08)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--n-200);background:var(--white);color:var(--n-600);display:inline-grid;place-items:center;cursor:pointer;text-decoration:none}
.iconbtn:hover{background:var(--n-100)}

/* ---------- aplicativo ---------- */
.top{background:var(--green-900);color:var(--white);padding:max(12px,env(safe-area-inset-top)) 20px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
.wrap{max-width:none;margin:0;padding:20px 16px calc(var(--nav-h) + 32px)}
.wrap h1{font-size:26px;margin-bottom:6px}
.eyebrow{font:600 11px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--green-500);margin:0 0 10px}
.lead{margin:0 0 20px;color:var(--n-500)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{background:var(--white);border:1px solid var(--n-200);border-radius:var(--r-card);padding:20px;box-shadow:0 1px 2px rgba(0,16,48,.05);margin-bottom:16px}
.card h2{font-size:17px;margin-bottom:14px}
.card p{margin:0 0 10px;color:var(--n-500)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:520px){.grid2,.grid3{grid-template-columns:1fr}.grid2.keep{grid-template-columns:1fr 1fr}}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;min-width:0}
.f label{font:500 12.5px/1.2 var(--font);color:var(--n-600)}
.f input,.f select,.f textarea{height:46px;border-radius:var(--r-field);border:1px solid var(--n-300);background:var(--white);color:var(--n-700);padding:0 14px;font:400 15px var(--font);width:100%}
.f textarea{height:auto;min-height:84px;padding:12px 14px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:#0090f8;box-shadow:0 0 0 3px rgba(0,144,248,.18)}
.f .hint{font:400 12px/1.3 var(--font);color:var(--n-500)}
.search{position:relative;margin-bottom:14px}
.search input{height:48px;border-radius:var(--r-field);border:1px solid var(--n-300);padding:0 16px 0 44px;width:100%;font:400 15px var(--font);background:var(--white)}
.search .ic{position:absolute;left:14px;top:14px;color:var(--n-400)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:thin}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--n-300);background:var(--white);color:var(--n-600);font:500 13px var(--font);white-space:nowrap;cursor:pointer;flex:none}
.chip.on{background:var(--green-500);border-color:var(--green-500);color:var(--white)}
.list{background:var(--white);border:1px solid var(--n-200);border-radius:var(--r-card);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--n-100);text-decoration:none;color:inherit;cursor:pointer;min-height:64px}
.item:last-child{border-bottom:0}
.item:hover{background:var(--n-50)}
.item .t{font-weight:600;color:var(--navy-900);line-height:1.3;overflow:hidden;text-overflow:ellipsis}
.item .d{font-size:13px;color:var(--n-500);line-height:1.35}
.avatar{width:42px;height:42px;border-radius:12px;background:var(--green-100);color:var(--green-500);display:grid;place-items:center;font:700 16px var(--display);flex:none}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;background:var(--n-100);color:var(--n-500);font:600 11px var(--font);white-space:nowrap}
.badge.good{background:var(--green-100);color:#006b3c}
.badge.warn{background:var(--warn-soft);color:#7a5200}
.badge.crit{background:var(--danger-soft);color:#9a2a22}
.empty{background:var(--white);border:1px dashed var(--n-300);border-radius:var(--r-card);padding:28px 20px;text-align:center}
.empty p{margin:0 0 16px;color:var(--n-500)}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.sec-h h2{font-size:16px}
.ctt{border:1px solid var(--n-200);border-radius:16px;padding:14px;margin-bottom:12px;background:var(--n-50)}
.ctt .row{margin-bottom:8px}
.actbar{display:flex;gap:10px;flex-wrap:wrap}
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--white);border-top:1px solid var(--n-200);display:flex;z-index:6}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--n-500);font:500 11px var(--font)}
.nav a.on{color:var(--green-500)}
.nav a.off{opacity:.45;pointer-events:none}
.tblwrap{overflow:auto;border:1px solid var(--n-200);border-radius:16px;background:var(--white)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--n-50);text-align:left;padding:10px 12px;font:600 11px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--n-500);position:sticky;top:0}
td{padding:10px 12px;border-top:1px solid var(--n-100);vertical-align:top}
.progress{height:10px;border-radius:999px;background:var(--n-100);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--green-400);width:0;transition:width .3s var(--ease)}
.maprow{display:grid;grid-template-columns:1fr 1.2fr;gap:10px;align-items:center;margin-bottom:10px}
.maprow .f{margin:0}
.maprow .lab{font:500 13.5px var(--font);color:var(--n-700)}
.maprow .lab small{display:block;color:var(--n-500);font-weight:400;font-size:12px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font:500 14px var(--font);color:var(--n-700)}
.chk input{width:20px;height:20px;accent-color:var(--green-500)}
.steps{display:flex;gap:6px;margin:0 0 18px}
.steps i{flex:1;height:5px;border-radius:999px;background:var(--n-200)}
.steps i.on{background:var(--green-400)}
.scrim{position:fixed;inset:0;background:rgba(0,11,33,.6);backdrop-filter:blur(3px);z-index:20;display:grid;place-items:end center}
.sheet{background:var(--white);border-radius:28px 28px 0 0;width:100%;max-width:560px;padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h2{font-size:19px;margin-bottom:8px}
.sheet p{margin:0 0 16px;color:var(--n-500)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px);transform:translateX(-50%);background:var(--navy-900);color:var(--white);padding:12px 18px;border-radius:14px;font:500 13.5px var(--font);z-index:30;max-width:90vw;text-align:center}
.loading{min-height:100vh;display:grid;place-items:center;background:var(--grad-assist)}
.loading img{width:56px;height:56px;object-fit:contain;animation:fade .6s var(--ease) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.mapbox{height:340px;border-radius:16px;overflow:hidden;border:1px solid var(--n-200);margin-bottom:14px;background:var(--n-100)}
.leaflet-container{font-family:var(--font)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--white);border:1px solid var(--n-200);border-radius:16px;padding:12px 14px}
.kpi b{display:block;font:600 20px var(--display);color:var(--navy-900)}
.kpi span{font-size:12px;color:var(--n-500)}
.stop{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--n-100);align-items:flex-start}
.stop:last-child{border-bottom:0}
.stop .num{width:30px;height:30px;border-radius:50%;background:var(--green-500);color:#fff;display:grid;place-items:center;font:700 13px var(--display);flex:none;margin-top:2px}
.stop.feito{opacity:.55}.stop.feito .num{background:var(--n-400)}
.stop .t{font-weight:600;color:var(--navy-900);line-height:1.3}
.stop .d{font-size:13px;color:var(--n-500);line-height:1.4}
.stop .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pick{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--n-100);min-height:60px;cursor:pointer}
.pick:last-child{border-bottom:0}
.pick input{width:22px;height:22px;accent-color:var(--green-500);flex:none}
.pick.dis{opacity:.5;cursor:not-allowed}
/* ===== layout v2: celular + computador em tela cheia ===== */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{margin:0}
.side{display:none}
.main{min-width:0}
.sidenav{display:flex;flex-direction:column;gap:4px}
.sidenav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:rgba(255,255,255,.78);text-decoration:none;font:500 14px var(--font)}
.sidenav a:hover{background:rgba(255,255,255,.08)}
.sidenav a.on{background:rgba(255,255,255,.14);color:#fff}
.sidenav .sep{height:1px;background:rgba(255,255,255,.12);margin:8px 6px}
.who{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;color:rgba(255,255,255,.8);font:500 13px var(--font)}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:26px;position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--grad-assist);padding:24px 16px;z-index:6;overflow-y:auto;color:#fff}
  .main{margin-left:240px}
  .top{display:none}.nav{display:none}
  .wrap{padding:28px 36px 56px}
  .toast{bottom:24px}
  .scrim{place-items:center}
  .sheet{border-radius:24px;max-width:640px;padding-bottom:22px}
}
.kpis4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
@media (min-width:900px){.kpis4{grid-template-columns:repeat(4,1fr)}}
.kpi b{font-size:24px}
.dash{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:900px){.dash{grid-template-columns:repeat(2,1fr)}}
.dash .card{margin:0}
.formgrid{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
@media (min-width:900px){.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1500px){.formgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.formgrid .card{margin-bottom:0}
.only-desk{display:none}
@media (min-width:900px){.only-desk{display:block}.only-mob{display:none}}
.agenda{display:grid;gap:18px;grid-template-columns:1fr;align-items:start}
@media (min-width:900px){.agenda{grid-template-columns:minmax(330px,400px) minmax(0,1fr)}}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.calh b{font:600 17px var(--display);color:var(--navy-900);text-align:center}
.calh b::first-letter,.cap1::first-letter{text-transform:uppercase}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calw{font:600 11px var(--font);color:var(--n-500);text-align:center;padding:4px 0;text-transform:uppercase}
.cald{aspect-ratio:1/1;min-height:42px;border:1px solid var(--n-100);border-radius:12px;background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;font:500 14px var(--font);color:var(--n-700);padding:0}
.cald:hover{background:var(--n-50)}
.cald.fora{opacity:.4}
.cald.hoje{border-color:var(--green-400);font-weight:700}
.cald.sel{background:var(--green-500);color:#fff;border-color:var(--green-500)}
.cald i{font:700 10px var(--font);font-style:normal;color:var(--green-500)}
.cald.sel i{color:#fff}
.vis{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--n-100);cursor:pointer;align-items:flex-start}
.vis:last-child{border-bottom:0}
.vis:hover{background:var(--n-50)}
.vis .hr{width:64px;flex:none;font:700 15px var(--display);color:var(--navy-900)}
.vis .hr small{display:block;font:500 11px var(--font);color:var(--n-500)}
.vis .t{font-weight:600;color:var(--navy-900);line-height:1.3}
.vis .d{font-size:13px;color:var(--n-500);line-height:1.4}
.vis.cancel .t{text-decoration:line-through;color:var(--n-500)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pickbox{border:1px solid var(--n-200);border-radius:14px;max-height:220px;overflow:auto;margin-top:6px;background:var(--white)}
.pickbox button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--n-100);padding:10px 14px;cursor:pointer;font:500 14px var(--font);color:var(--n-700)}
.pickbox button:hover:not([disabled]){background:var(--n-50)}
.pickbox button[disabled]{opacity:.55;cursor:not-allowed}
.pickbox small{display:block;color:var(--n-500);font-weight:400}
.rotagrid{display:grid;gap:18px;grid-template-columns:1fr;align-items:start}
@media (min-width:1100px){.rotagrid{grid-template-columns:minmax(360px,440px) minmax(0,1fr)}}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tbl-click tbody tr{cursor:pointer}
.tbl-click tbody tr:hover{background:var(--n-50)}
.tbl-click td,.tbl-click th{padding:12px 14px}
.search{max-width:560px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,210px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar .bl{color:var(--n-700);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .bt{height:12px;border-radius:999px;background:var(--n-100);overflow:hidden}
.bar .bt i{display:block;height:100%;background:var(--green-400);border-radius:999px}
.bar .bv{font:700 13px var(--font);color:var(--navy-900);min-width:34px;text-align:right}
.bar .bv small{font-weight:400;color:var(--n-500)}
.relfil{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));align-items:end}
.relfil .f{margin:0}
.relcab{margin:0 0 12px;font:600 14px var(--font);color:var(--n-600)}
.onlyprint{display:none}
@media print{
  .side,.nav,.top,.noprint,.toast,.scrim{display:none!important}
  .main{margin:0!important}.wrap{padding:0!important}
  body{background:#fff}.onlyprint{display:block}
  .card,.tblwrap{box-shadow:none!important}
  .kpis4{grid-template-columns:repeat(4,1fr)!important}.dash{grid-template-columns:repeat(2,1fr)!important}
}

.mapbox{height:340px}
@media (min-width:900px){.mapbox{height:420px}}
</style>
</head>
<body>

<div id="v-load" class="loading"><img src="assets/mark-green.png" alt="Banheza Rota"></div>

<!-- ENTRAR / CRIAR CONTA / NOVA SENHA -->
<main id="v-auth" class="auth" hidden>
  <div class="in">
    <div class="lockup"><img class="mk" src="assets/mark-green.png" alt=""><div class="wm"><img src="assets/wordmark-white.png" alt="Banheza"><span>ROTA</span></div></div>
    <h1 id="a-title">Entrar</h1>
    <p class="sub" id="a-sub">Acesse com a sua conta.</p>
    <div id="a-msg" class="msg" hidden role="status"></div>
    <form id="a-form" novalidate>
      <div class="afield" id="f-nome" hidden><label for="i-nome">Seu nome</label><input id="i-nome" autocomplete="name" placeholder="Como você quer ser chamado"></div>

/* ===================== CSV / planilha ===================== */
function lerCSV(texto){
  texto=String(texto||"");if(texto.charCodeAt(0)===65279)texto=texto.slice(1);
  const prim=texto.split(/\r?\n/)[0]||"";
  const sep=[";","\t",","].map(s=>[s,prim.split(s).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const linhas=[];let cel="",lin=[],asp=false;
  const fim=()=>{lin.push(cel);cel="";if(lin.some(x=>x.trim()!==""))linhas.push(lin);lin=[];};
  for(let i=0;i<texto.length;i++){
    const c=texto[i];
    if(asp){if(c==='"'){if(texto[i+1]==='"'){cel+='"';i++;}else asp=false;}else cel+=c;}
    else if(c==='"')asp=true;
    else if(c===sep){lin.push(cel);cel="";}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&texto[i+1]==="\n")i++;fim();}
    else cel+=c;
  }
  if(cel!==""||lin.length)fim();
  return linhas;
}
function decodifica(buf){
  try{return new TextDecoder("utf-8",{fatal:true}).decode(buf);}
  catch(e){return new TextDecoder("windows-1252").decode(buf);}   // planilhas antigas (Excel em português)
}
let xlsxP=null;
function carregaXLSX(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  if(xlsxP)return xlsxP;
  xlsxP=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>res(window.XLSX);s.onerror=()=>rej(new Error("Não foi possível carregar o leitor de Excel."));document.head.appendChild(s);});
  return xlsxP;
}
async function lerArquivo(file){
  const buf=await file.arrayBuffer();
  if(/\.(xlsx|xls)$/i.test(file.name)){
    const X=await carregaXLSX();const wb=X.read(buf,{type:"array"});
    const ws=wb.Sheets[wb.SheetNames[0]];
    return X.utils.sheet_to_json(ws,{header:1,raw:false,defval:""}).map(l=>l.map(c=>String(c==null?"":c))).filter(l=>l.some(c=>c.trim()!==""));
  }
  return lerCSV(decodifica(buf));
}

  const out=[];

    if(error)throw error;out.push(...(data||[]));if(!data||data.length<1000)break;
  }

}

  const m=String((e&&e.message)||e||"");

  if(/rota_visitas|checkin_(lat|lng)/i.test(m))return "A agenda ainda não foi ativada no banco. Rode o arquivo supabase-rota-etapa3.sql no SQL Editor do Supabase.";

  if(/JWT|not authenticated|permission denied|row-level security/i.test(m))return "Sua sessão expirou. Entre de novo.";

      :`<div class="empty"><p>Nenhuma representada ainda. Cadastre a primeira para vincular os seus clientes.</p></div>`}`;
  v.querySelector("#nova").onclick=()=>formRep(null);

function formRep(r){
  sheet(`<h2>${r?"Editar representada":"Nova representada"}</h2>
    <div class="f"><label for="rn">Nome da empresa</label><input id="rn" value="${esc(r?r.nome:"")}" placeholder="Ex.: Indústria Exemplo Ltda"></div>
    <div class="f"><label for="rc">Comissão (%) — opcional</label><input id="rc" inputmode="decimal" value="${r&&r.comissao!=null?esc(String(r.comissao).replace(".",",")):""}" placeholder="Ex.: 5"></div>
    <div class="f"><label for="ro">Observações</label><textarea id="ro">${esc(r?r.obs:"")}</textarea></div>
    <div id="rm"></div>
    <div class="actbar"><button class="btn primary" id="rs">Salvar</button>${r?'<button class="btn danger" id="rd">Excluir</button>':""}<button class="btn sec" id="rx">Cancelar</button></div>`,d=>{
    d.querySelector("#rx").onclick=closeSheet;
    d.querySelector("#rs").onclick=async()=>{
      const nome=d.querySelector("#rn").value.trim();if(!nome){d.querySelector("#rm").innerHTML='<div class="msg err">Digite o nome da empresa.</div>';return;}
      const cm=d.querySelector("#rc").value.trim().replace(",",".");const comissao=cm===""?null:Number(cm);
      if(cm!==""&&!isFinite(comissao)){d.querySelector("#rm").innerHTML='<div class="msg err">Comissão inválida.</div>';return;}
      const obj={nome,comissao,obs:d.querySelector("#ro").value.trim()};
      const q=r?supa.from("rota_representadas").update(obj).eq("id",r.id).select().single():supa.from("rota_representadas").insert(obj).select().single();
      const{data,error}=await q;
      if(error){d.querySelector("#rm").innerHTML=`<div class="msg err">${esc(erroBanco(error))}</div>`;return;}
      if(r)Object.assign(r,data);else S.reps.push(data);
      S.reps.sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));closeSheet();toast("Representada salva.");rota();
    };
    r&&(d.querySelector("#rd").onclick=()=>confirma("Excluir representada?","Os clientes não são apagados; só deixam de estar vinculados a ela.","Excluir",async()=>{
      const{error}=await supa.from("rota_representadas").delete().eq("id",r.id);
      if(error)return toast(erroBanco(error));
      S.reps=S.reps.filter(x=>x.id!==r.id);toast("Representada excluída.");rota();
    }));
  });
}

/* ---------- lista de clientes ---------- */
let FILTRO={q:"",rep:""};
function telaClientes(v){
  const semLoc=S.clientes.filter(c=>c.ativo&&c.lat==null&&(c.endereco||c.cep||c.cidade)&&c.geo_status!=="falhou").length;
  v.innerHTML=`<div class="ph"><div><p class="eyebrow">Cadastro</p><h1>Clientes</h1></div><div class="actbar"><a class="btn sec" href="#/mapa">${IC("map-pin","sm")} Mapa</a><a class="btn sec" href="#/importar">${IC("file-spreadsheet","sm")} Importar</a><a class="btn primary" href="#/clientes/novo">${IC("plus","sm")} Novo cliente</a></div></div>
    ${semLoc?`<div class="msg warn row between" style="margin-bottom:14px"><span>${semLoc} cliente${semLoc>1?"s":""} sem localização no mapa.</span><button class="btn sec sm" id="loc">Localizar agora</button></div>`:""}
    <div class="row" style="margin-bottom:6px;align-items:flex-start"><div class="search grow" style="min-width:240px">${IC("search")}<input id="q" type="search" placeholder="Buscar nome, CNPJ, cidade ou comprador" value="${esc(FILTRO.q)}" aria-label="Buscar clientes"></div></div>
    ${S.reps.length?`<div class="chips" id="chips"><button class="chip ${FILTRO.rep===""?"on":""}" data-r="">Todas as empresas</button>${S.reps.map(r=>`<button class="chip ${FILTRO.rep===r.id?"on":""}" data-r="${esc(r.id)}">${esc(r.nome)}</button>`).join("")}</div>`:""}
    <p class="lead" id="cont" style="margin-bottom:10px"></p><div id="lista"></div>`;
  const desenha=()=>{
    const q=semAcento(FILTRO.q).trim();
    const lista=S.clientes.filter(c=>c.ativo).filter(c=>!FILTRO.rep||(c.representadas||[]).includes(FILTRO.rep)).filter(c=>{
      if(!q)return true;
      const t=semAcento([c.razao,c.fantasia,c.cidade,c.bairro,c.segmento,contatosDe(c.id).map(x=>x.nome).join(" ")].join(" "));
      const td=dig(c.doc);   // o CNPJ pode ser digitado com ou sem pontos
      return q.split(/\s+/).every(w=>t.includes(w)||(dig(w).length>=3&&td.includes(dig(w))));
    }).sort((a,b)=>nomeCli(a).localeCompare(nomeCli(b),"pt-BR"));
    v.querySelector("#cont").textContent=lista.length+(lista.length===1?" cliente":" clientes");
    const mostra=lista.slice(0,300),hoje=hojeISO();
    if(!lista.length){
      v.querySelector("#lista").innerHTML=`<div class="empty"><p>${S.clientes.length?"Nenhum cliente encontrado. Tente outra busca.":"Você ainda não tem clientes. Cadastre o primeiro ou importe uma planilha."}</p>${S.clientes.length?"":`<div class="actbar" style="justify-content:center"><a class="btn primary" href="#/clientes/novo">Novo cliente</a><a class="btn sec" href="#/importar">Importar planilha</a></div>`}</div>`;
      return;
    }
    // celular: lista; computador: tabela larga
    const mob=`<div class="list only-mob">${mostra.map(c=>{
      const comp=contatosDe(c.id).find(t=>t.principal)||contatosDe(c.id)[0];
      const loc=[c.cidade&&(c.cidade+(c.uf?"/"+c.uf:"")),comp&&comp.nome].filter(Boolean).join(" · ");
      return `<a class="item" href="#/clientes/${esc(c.id)}"><span class="avatar">${esc(iniciais(c))}</span><div class="grow"><div class="t">${esc(nomeCli(c))}</div><div class="d">${esc(loc||"Sem endereço")}</div></div>${!c.cep&&!c.endereco?'<span class="badge warn">sem endereço</span>':""}${IC("chevron-right","sm")}</a>`;
    }).join("")}</div>`;
    const desk=`<div class="tblwrap only-desk"><table class="tbl-click"><thead><tr><th>Cliente</th><th>Comprador</th><th>Telefone</th><th>Cidade</th><th>Representadas</th><th>Última visita</th><th>Próxima visita</th><th></th></tr></thead><tbody>${mostra.map(c=>{
      const comp=contatosDe(c.id).find(t=>t.principal)||contatosDe(c.id)[0];
      const fone=(comp&&comp.tel)||c.celular||c.tel||"";
      const u=ultimaVisita(c.id),p=proximaVisita(c.id);
      return `<tr data-cli="${esc(c.id)}"><td><b>${esc(nomeCli(c))}</b>${c.fantasia&&c.razao&&c.fantasia!==c.razao?`<div style="color:var(--n-500);font-size:12px">${esc(c.razao)}</div>`:""}</td>
        <td>${esc(comp?comp.nome:"")}</td><td style="white-space:nowrap">${esc(fmtTel(fone))}</td>
        <td>${esc([c.cidade,c.uf].filter(Boolean).join("/"))||'<span class="badge warn">sem endereço</span>'}</td>
        <td><div class="badges" style="margin:0">${(c.representadas||[]).map(id=>`<span class="badge">${esc(repNome(id))}</span>`).join("")}</div></td>
        <td style="white-space:nowrap">${u?esc(dataCurta(u.data)):"—"}</td><td style="white-space:nowrap">${p?esc(dataCurta(p.data)):"—"}</td>
        <td style="text-align:right"><button class="btn sec sm" data-ag="${esc(c.id)}">Agendar</button></td></tr>`;
    }).join("")}</tbody></table></div>`;
    v.querySelector("#lista").innerHTML=mob+desk+(lista.length>300?`<p class="lead" style="margin-top:10px">Mostrando 300 de ${lista.length}. Use a busca para achar os demais.</p>`:"");
    v.querySelectorAll("#lista tr[data-cli]").forEach(tr=>tr.onclick=e=>{if(e.target.closest("[data-ag]"))return;location.hash="#/clientes/"+tr.dataset.cli;});
    v.querySelectorAll("#lista [data-ag]").forEach(b=>b.onclick=e=>{e.stopPropagation();formVisita(null,b.dataset.ag);});
  };
  v.querySelector("#loc")&&(v.querySelector("#loc").onclick=()=>abreLocalizacao(()=>rota()));
  v.querySelector("#q").oninput=e=>{FILTRO.q=e.target.value;desenha();};
  v.querySelectorAll("#chips .chip").forEach(b=>b.onclick=()=>{FILTRO.rep=b.dataset.r;v.querySelectorAll("#chips .chip").forEach(x=>x.classList.toggle("on",x===b));desenha();});
  desenha();
}

      <button type="button" class="btn danger sm" data-rm="${i}">${IC("trash-2","sm")} Remover</button></div></div>`).join("")||`<p class="lead">Nenhum contato. Adicione o comprador ou o responsável.</p>`;
    v.querySelectorAll("#ctts [data-rm]").forEach(b=>b.onclick=()=>{lerCtts();ctts.splice(+b.dataset.rm,1);desenhaCtts();});
  };
  const lerCtts=()=>v.querySelectorAll("#ctts .ctt").forEach(el=>{const t=ctts[+el.dataset.i];el.querySelectorAll("[data-f]").forEach(i=>{t[i.dataset.f]=i.value.trim();});});
  v.innerHTML=`<div class="ph"><div class="row"><a class="iconbtn" href="#/clientes" aria-label="Voltar">${IC("arrow-left")}</a><div><p class="eyebrow" style="margin:0 0 4px">Cliente</p><h1>${novo?"Novo cliente":esc(nomeCli(c))}</h1></div></div>
      <div class="actbar">${novo?"":`<button class="btn sec" id="agv" type="button">${IC("calendar-plus","sm")} Agendar visita</button>`}<button class="btn primary" id="salvar2" type="button">Salvar cliente</button></div></div>
    <div id="msg"></div>
    <div class="formgrid">
    <div class="card"><h2>Empresa</h2>
      <div class="f"><label for="c_razao">Razão social ou nome</label><input id="c_razao" value="${esc(c.razao)}" autocomplete="off"></div>
      ${campo("fantasia","Nome fantasia")}
      <div class="grid2">${campo("doc","CNPJ ou CPF",'inputmode="numeric"')}${campo("segmento","Segmento")}</div>
      ${campo("ie","Inscrição estadual")}
    </div>

      <div class="f"><label for="c_endereco">Rua / avenida</label><input id="c_endereco" value="${esc(c.endereco)}"></div>

    </div>
    <div class="card"><h2>Telefones e e-mail da empresa</h2>
      <div class="grid2">${campo("tel","Telefone",'inputmode="tel"')}${campo("celular","Celular / WhatsApp",'inputmode="tel"')}</div>

    </div>
    <div class="card"><div class="sec-h" style="margin-top:0"><h2 style="margin:0">Contatos (comprador e outros)</h2><button class="btn sec sm" id="addc" type="button">${IC("plus","sm")} Adicionar</button></div><div id="ctts"></div></div>
    <div class="card"><h2>Preferências de visita</h2>
      <div class="f"><label for="c_horario">Dias e horários em que atende</label><input id="c_horario" value="${esc(c.horario)}" placeholder="Ex.: seg a sex, 8h às 17h"></div>
      <div class="grid2"><div class="f"><label for="c_tempo">Tempo médio de visita (min)</label><input id="c_tempo" inputmode="numeric" value="${c.tempo_visita_min==null?"":esc(c.tempo_visita_min)}"></div><div class="f"><label for="c_freq">Visitar a cada (dias)</label><input id="c_freq" inputmode="numeric" value="${c.freq_dias==null?"":esc(c.freq_dias)}"></div></div>
    </div>

    </div>
    <div class="card"><h2>Observações</h2><div class="f" style="margin:0"><textarea id="c_obs">${esc(c.obs)}</textarea></div></div>
    ${novo?"":`<div class="card"><div class="sec-h" style="margin-top:0"><h2 style="margin:0">Histórico de visitas</h2></div>${visDoCliente(c.id).length?`<div class="list" style="border:0;border-radius:0">${visDoCliente(c.id).sort((a,b)=>chaveVis(b).localeCompare(chaveVis(a))).slice(0,8).map(x=>linhaVisita(x,{data:1,status:1,resultado:1})).join("")}</div>`:`<p style="margin:0">Nenhuma visita registrada para este cliente.</p>`}</div>`}

  // busca do endereço pelo CEP (ViaCEP)
  const cep=v.querySelector("#c_cep"),cm=v.querySelector("#cepmsg");
  cep.oninput=async()=>{
    const d=dig(cep.value);if(d.length>5)cep.value=d.slice(0,5)+"-"+d.slice(5,8);
    if(d.length!==8){cm.textContent="Digite o CEP para preencher o endereço.";return;}
    cm.textContent="Buscando…";
    try{
      const r=await fetch("https://viacep.com.br/ws/"+d+"/json/");const j=await r.json();
      if(j.erro){cm.textContent="CEP não encontrado. Preencha o endereço à mão.";return;}
      const set=(id,val)=>{const e=v.querySelector(id);if(e&&!e.value.trim()&&val)e.value=val;};
      set("#c_endereco",j.logradouro);set("#c_bairro",j.bairro);set("#c_cidade",j.localidade);set("#c_uf",j.uf);
      cm.textContent="Endereço preenchido. Confira e informe o número.";v.querySelector("#c_numero").focus();
    }catch(e){cm.textContent="Não foi possível buscar o CEP agora. Preencha o endereço à mão.";}
  };
  v.querySelector("#salvar").onclick=async()=>{
    lerCtts();
    const g=k=>v.querySelector("#c_"+k).value.trim();
    const msg=t=>{v.querySelector("#msg").innerHTML=`<div class="msg err">${esc(t)}</div>`;window.scrollTo(0,0);};
    if(!g("razao"))return msg("Digite a razão social ou o nome do cliente.");
    const doc=dig(g("doc"));
    if(doc&&doc.length!==11&&doc.length!==14)return msg("O CNPJ tem 14 números e o CPF tem 11. Confira o que foi digitado.");
    const dup=doc&&S.clientes.find(x=>x.doc===doc&&x.id!==c.id);
    if(dup)return msg("Já existe um cliente com este CNPJ/CPF: "+nomeCli(dup)+".");
    const num=k=>{const t=g(k);return t===""?null:Math.max(0,parseInt(t,10)||0);};
    const obj={razao:g("razao"),fantasia:g("fantasia"),doc,ie:g("ie"),segmento:g("segmento"),cep:dig(g("cep")),endereco:g("endereco"),numero:g("numero"),complemento:g("complemento"),bairro:g("bairro"),cidade:g("cidade"),uf:g("uf").toUpperCase(),
      tel:g("tel"),celular:g("celular"),email:g("email"),site:g("site"),obs:v.querySelector("#c_obs").value.trim(),horario:g("horario"),tempo_visita_min:num("tempo"),freq_dias:num("freq"),
      representadas:[...v.querySelectorAll("[data-rep]")].filter(i=>i.checked).map(i=>i.dataset.rep),atualizado_em:new Date().toISOString()};
    // se o endereço mudou, o ponto no mapa antigo deixa de valer
    if(!novo&&(obj.cep!==(c.cep||"")||obj.endereco!==c.endereco||obj.numero!==c.numero||obj.cidade!==c.cidade)){obj.lat=null;obj.lng=null;}
    const b=v.querySelector("#salvar");b.disabled=true;b.textContent="Salvando…";
    try{
      const q=novo?supa.from("rota_clientes").insert({...obj,origem:"manual"}).select().single():supa.from("rota_clientes").update(obj).eq("id",c.id).select().single();
      const{data,error}=await q;if(error)throw error;
      const cid=data.id;
      // contatos: apaga os removidos, atualiza os existentes, cria os novos
      const manter=ctts.filter(t=>t.nome||t.tel||t.email||t.cargo);
      const antigos=novo?[]:contatosDe(cid);
      const remover=antigos.filter(a=>!manter.some(t=>t._id===a.id)).map(a=>a.id);
      if(remover.length){const{error:e1}=await supa.from("rota_contatos").delete().in("id",remover);if(e1)throw e1;}
      const mantidos=[];
      for(const t of manter){
        const campos={nome:t.nome,cargo:t.cargo,tel:t.tel,email:t.email,principal:false};
        if(antigos.some(a=>a.id===t._id)){const{data:u,error:e2}=await supa.from("rota_contatos").update(campos).eq("id",t._id).select().single();if(e2)throw e2;mantidos.push(u);}
        else{const{data:n,error:e3}=await supa.from("rota_contatos").insert({...campos,cliente_id:cid}).select().single();if(e3)throw e3;mantidos.push(n);}
      }
      S.contatos=S.contatos.filter(t=>t.cliente_id!==cid).concat(mantidos);
      if(novo)S.clientes.push(data);else Object.assign(c,data);
      toast("Cliente salvo.");location.hash="#/clientes";
    }catch(e){msg(erroBanco(e));b.disabled=false;b.textContent="Salvar cliente";}
  };
  const ex=v.querySelector("#excluir");
  ex&&(ex.onclick=()=>confirma("Excluir cliente?","Os contatos deste cliente também serão apagados. Isso não pode ser desfeito.","Excluir",async()=>{
    const{error}=await supa.from("rota_clientes").delete().eq("id",c.id);
    if(error)return toast(erroBanco(error));
    S.clientes=S.clientes.filter(x=>x.id!==c.id);S.contatos=S.contatos.filter(t=>t.cliente_id!==c.id);
    toast("Cliente excluído.");location.hash="#/clientes";
  }));
}

];
let IMP=null;

function chaveCab(h){return semAcento(h).replace(/\s+/g," ").trim();}
function adivinhar(cab){
  const map={},usado=new Set(),norm=cab.map(chaveCab);
  const salvo=(()=>{try{return JSON.parse(localStorage.getItem("rota_map_"+norm.join("|"))||"null");}catch(e){return null;}})();
  if(salvo){for(const k in salvo){if(salvo[k]>=0&&salvo[k]<cab.length)map[k]=salvo[k];}return{map,salvo:true};}
  for(const f of CAMPOS){
    const i=norm.findIndex((h,ix)=>!usado.has(ix)&&f.syn.includes(h));
    if(i>=0){map[f.k]=i;usado.add(i);}
  }
  return{map,salvo:false};
}
function limpaEndereco(o){
  let rua=String(o.endereco||"").trim().replace(/[,\s]+$/,"").replace(/\s{2,}/g," ");
  let num=String(o.numero||"").trim().replace(/\s{2,}/g," "),comp=String(o.complemento||"").trim();
  const m=/^(.*?),\s*(\d+[A-Za-z]?)$/.exec(rua);
  if(m){
    if(!num||/^s\/?n$/i.test(num)||!/^\d/.test(num)){ if(num&&!/^s\/?n$/i.test(num))comp=(comp+" "+num).trim(); num=m[2]; }
    rua=m[1].trim();
  }
  if(/^s\/?n$/i.test(num))num="S/N";
  o.endereco=rua;o.numero=num;o.complemento=comp;
  return o;
}
function normalizaLinha(l,map,tipoLimpo){
  const g=k=>map[k]==null?"":String(l[map[k]]==null?"":l[map[k]]).replace(/\s+\n/g,"\n").trim();
  const o={razao:g("razao"),fantasia:g("fantasia"),doc:dig(g("doc")),ie:g("ie"),segmento:g("segmento"),cep:dig(g("cep")),endereco:g("endereco"),numero:g("numero"),complemento:g("complemento"),bairro:g("bairro"),
    cidade:g("cidade"),uf:g("uf").toUpperCase().slice(0,2),tel:fmtTel(g("tel")),celular:fmtTel(g("celular")),email:g("email"),site:g("site"),obs:g("obs"),id_externo:g("id_externo")};
  if(o.cep.length!==8)o.cep=o.cep.length===7?"0"+o.cep:o.cep;
  if(o.doc&&o.doc.length!==11&&o.doc.length!==14){ if(o.doc.length===13)o.doc="0"+o.doc; else if(o.doc.length===10)o.doc="0"+o.doc; }
  if(o.fantasia&&chave(o.fantasia)===chave(o.razao))o.fantasia="";
  limpaEndereco(o);
  o._contato=g("contato");o._tipo=g("tipo");o._vendedor=g("vendedor");o._situacao=g("situacao");
  return o;
}
const chaveNomeCidade=o=>chave(o.razao)+"|"+chave(o.cidade);

      <div id="msg"></div>
      <div class="card"><h2>Para qual representada?</h2>
        <div class="f"><label for="repsel">Representada</label><select id="repsel"><option value="">Nenhuma (só adicionar à carteira)</option>${S.reps.map(r=>`<option value="${esc(r.id)}" ${IMP.repId===r.id?"selected":""}>${esc(r.nome)}</option>`).join("")}<option value="__nova">+ Criar nova representada…</option></select></div>
        <div class="f" id="novarep" ${IMP.repId==="__nova"?"":"hidden"}><label for="nrep">Nome da nova representada</label><input id="nrep" value="${esc(IMP.novaRep)}"></div>
      </div>

        ${IMP.map.tipo!=null?`<p>Tipo de contato</p>${tipos.map(([n,q])=>`<label class="chk"><input type="checkbox" data-tipo="${esc(n)}" ${IMP.tipos.has(n)?"checked":""}> ${esc(n)} <span class="badge">${q}</span></label>`).join("")}`:""}
        ${IMP.map.vendedor!=null&&vends.length?`<div class="f" style="margin-top:10px"><label for="vend">Vendedor</label><select id="vend"><option value="">Todos os vendedores</option>${vends.map(([n,q])=>`<option value="${esc(n)}" ${IMP.vendedor===n?"selected":""}>${esc(n)} (${q})</option>`).join("")}</select></div>`:""}

        ${IMP.map.tipo==null&&IMP.map.vendedor==null&&IMP.map.situacao==null?`<p>Todas as linhas serão conferidas na próxima etapa.</p>`:""}
      </div>

    v.querySelectorAll("select[data-campo]").forEach(s=>{s.value=IMP.map[s.dataset.campo]==null?"":String(IMP.map[s.dataset.campo]);s.onchange=()=>{if(s.value==="")delete IMP.map[s.dataset.campo];else IMP.map[s.dataset.campo]=+s.value;IMP.tipos=null;IMP.salvo=false;};});

      try{localStorage.setItem("rota_map_"+IMP.cab.map(chaveCab).join("|"),JSON.stringify(IMP.map));}catch(e){}

    return;
  }

  if(IMP.passo===3){
    const P=IMP.previa,cont={novo:0,existe:0,repetido:0,erro:0};
    P.forEach(r=>{cont[r.estado==="semnome"?"erro":r.estado]=(cont[r.estado==="semnome"?"erro":r.estado]||0)+1;});
    const ROT={novo:["good","Novo"],existe:["","Já existe — completa os dados"],repetido:["warn","Repetido na planilha"],semnome:["crit","Sem nome"]};
    const marc=()=>P.filter(r=>r.marcado).length;
    v.innerHTML=cab()+`<p class="lead"><b>${P.length}</b> cliente(s) para conferir: ${cont.novo} novo(s), ${cont.existe} já cadastrado(s)${cont.repetido?`, ${cont.repetido} repetido(s)`:""}${cont.erro?`, ${cont.erro} sem nome`:""}. Desmarque o que não quiser importar.</p>

    const atual=()=>{const n=marc(),b=v.querySelector("#go");b.textContent=n?`Importar ${n} cliente${n>1?"s":""}`:"Nada para importar";b.disabled=!n;};

function montaPrevia(){
  const tipoSel=IMP.tipos;
  const existentesDoc=new Map(S.clientes.filter(c=>c.doc).map(c=>[c.doc,c]));
  const existentesNome=new Map(S.clientes.filter(c=>!c.doc).map(c=>[chaveNomeCidade(c),c]));
  const vistos=new Set(),out=[];
  for(const l of IMP.linhas){
    const o=normalizaLinha(l,IMP.map);
    if(IMP.map.tipo!=null&&!tipoSel.has(o._tipo||"(sem tipo)"))continue;
    if(IMP.vendedor&&o._vendedor!==IMP.vendedor)continue;
    if(IMP.soAtivos&&IMP.map.situacao!=null&&o._situacao&&!/^ativ/i.test(o._situacao))continue;
    let estado="novo",ex=null;
    if(!o.razao)estado="semnome";
    else{
      const k=o.doc||chaveNomeCidade(o);
      if(vistos.has(k))estado="repetido";
      vistos.add(k);
      if(estado==="novo"){ex=(o.doc&&existentesDoc.get(o.doc))||(!o.doc&&existentesNome.get(chaveNomeCidade(o)))||null;if(ex)estado="existe";}
    }
    out.push({o,estado,ex,marcado:estado==="novo"||estado==="existe"});
  }
  IMP.previa=out;
}

async function executaImportacao(v){
  const stt=v.querySelector("#stt"),bar=v.querySelector("#bar"),res=v.querySelector("#res");
  const set=(t,p)=>{stt.textContent=t;bar.style.width=Math.round(p*100)+"%";};
  const sel=IMP.previa.filter(r=>r.marcado);
  let falhas=0,novos=0,atualizados=0,contatosNovos=0,motivo="";
  const guardaMotivo=e=>{if(!motivo&&e)motivo=String(e.message||e).slice(0,240);};
  try{
    {const{error:e0}=await supa.from("rota_clientes").select("id").range(0,0);if(e0)throw e0;}   // as tabelas existem?
    // representada (cria se for nova)
    let repId=IMP.repId==="__nova"?"":IMP.repId;
    if(IMP.repId==="__nova"){
      const{data,error}=await supa.from("rota_representadas").insert({nome:IMP.novaRep.trim()}).select().single();
      if(error)throw error;S.reps.push(data);repId=data.id;
    }
    const camposBase=["razao","fantasia","doc","ie","segmento","cep","endereco","numero","complemento","bairro","cidade","uf","tel","celular","email","site","obs","id_externo"];
    const novosRows=sel.filter(r=>r.estado==="novo"),exist=sel.filter(r=>r.estado==="existe");
    const total=novosRows.length+exist.length;let feito=0;
    const origem=IMP.bling?"bling":"planilha";
    // 1) clientes novos, em lotes
    for(let i=0;i<novosRows.length;i+=100){
      const lote=novosRows.slice(i,i+100);
      const rows=lote.map(r=>{const x={};camposBase.forEach(k=>x[k]=r.o[k]||"");x.representadas=repId?[repId]:[];x.origem=origem;return x;});
      const{data,error}=await supa.from("rota_clientes").insert(rows).select();
      if(error){
        // se algum lote falhar (ex.: CNPJ repetido), tenta um a um para não perder o resto
        for(let j=0;j<rows.length;j++){
          const{data:d1,error:e1}=await supa.from("rota_clientes").insert(rows[j]).select().single();
          if(e1){falhas++;guardaMotivo(e1);continue;}
          S.clientes.push(d1);novos++;lote[j].novoId=d1.id;
        }
      }else{data.forEach((d,j)=>{S.clientes.push(d);lote[j].novoId=d.id;});novos+=data.length;}
      feito+=lote.length;set(`Cadastrando clientes… ${feito} de ${total}`,feito/total*0.8);
    }
    // 2) contatos (comprador) dos clientes novos
    const cts=[];
    novosRows.forEach(r=>{if(r.novoId&&r.o._contato)cts.push({cliente_id:r.novoId,nome:r.o._contato,tel:r.o.celular||r.o.tel,email:r.o.email,principal:true});});
    for(let i=0;i<cts.length;i+=200){
      const{data,error}=await supa.from("rota_contatos").insert(cts.slice(i,i+200)).select();
      if(error){falhas+=cts.slice(i,i+200).length;guardaMotivo(error);continue;}
      S.contatos.push(...data);contatosNovos+=data.length;
    }
    set("Atualizando clientes que já existiam…",0.85);
    // 3) já existentes: completa campos vazios e acrescenta a representada
    for(const r of exist){
      const c=r.ex,upd={};
      camposBase.forEach(k=>{if(!String(c[k]||"").trim()&&String(r.o[k]||"").trim())upd[k]=r.o[k];});
      if(repId&&!(c.representadas||[]).includes(repId))upd.representadas=[...(c.representadas||[]),repId];
      if(Object.keys(upd).length){
        upd.atualizado_em=new Date().toISOString();
        const{data,error}=await supa.from("rota_clientes").update(upd).eq("id",c.id).select().single();
        if(error){falhas++;guardaMotivo(error);continue;}Object.assign(c,data);atualizados++;
      }
      feito++;
    }
    set("Pronto.",1);

}

const rad=x=>x*Math.PI/180;
function kmLinha(a,b){const R=6371,dLat=rad(b.lat-a.lat),dLng=rad(b.lng-a.lng);const h=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
const hojeISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const minHora=m=>{m=Math.round(m);const h=Math.floor(m/60)%24,mm=m%60;return String(h).padStart(2,"0")+":"+String(mm).padStart(2,"0");};
const horaMin=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s||"");return m?(+m[1])*60+(+m[2]):480;};
const fmtDur=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?(h+"h"+(r?" "+String(r).padStart(2,"0")+"min":"")):(r+" min");};
const fmtKm=k=>(Math.round(k*10)/10).toString().replace(".",",")+" km";
const fmtDiaSemana=iso=>{try{return new Date(iso+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"});}catch(e){return iso;}};
const lnkWaze=p=>`https://waze.com/ul?ll=${p.lat},${p.lng}&navigate=yes`;

const ROT_GEO={numero:"",rua:"",cep:"localização aproximada (CEP)",cidade:"só a cidade — corrija o endereço",falhou:"não encontrado",pendente:""};

/* ---- endereço -> ponto no mapa (Nominatim/OpenStreetMap, gratuito: 1 consulta por segundo) ---- */
async function nominatimBruto(params){
  for(let t=0;t<3;t++){
    let r;
    // GET simples (sem cabeçalhos extras). Quando o serviço gratuito pede calma (429), a resposta vem sem CORS e o
    // navegador a mostra como "falha de rede": tratamos igual — espera um pouco e tenta de novo.
    try{r=await fetch("https://nominatim.openstreetmap.org/search?"+new URLSearchParams({format:"jsonv2",limit:"5",addressdetails:"1",countrycodes:"br",...params}),{cache:"no-store"});}   // no-store: nunca reaproveitar uma resposta de erro guardada pelo navegador
    catch(e){await sleep(3000*(t+1));continue;}
    if(r.status===429||r.status===503){await sleep(2500*(t+1));continue;}
    if(!r.ok)throw new Error("geocoder "+r.status);
    const lista=(await r.json()).filter(x=>{const lat=+x.lat,lng=+x.lon;return lat<6&&lat>-34&&lng<-30&&lng>-74;});   // fora do Brasil = resultado errado
    return lista;
  }
  throw new Error("geocoder ocupado");
}
// Cada cidade é buscada uma vez; as ruas depois são procuradas SÓ dentro da área dessa cidade
// (sem isso, "Rua Augusta, 500, São Paulo" pode cair em outra cidade que também tem uma Rua Augusta).
const cacheCidade=new Map();
async function infoCidade(cidade,uf){
  const k=chave(cidade)+"|"+String(uf||"").toLowerCase();
  if(cacheCidade.has(k))return cacheCidade.get(k);
  const x=(await nominatimBruto({q:[cidade,uf].filter(Boolean).join(", ")}))[0];await sleep(1100);   // (countrycodes=br já restringe ao Brasil)
  let r=null;
  if(x&&x.boundingbox){const b=x.boundingbox.map(Number);r={lat:+x.lat,lng:+x.lon,vb:[b[2],b[1],b[3],b[0]].join(",")};}
  cacheCidade.set(k,r);return r;
}
async function localizar(o){
  const rua=String(o.endereco||o.casa_endereco||"").trim(),num=String(o.numero||o.casa_numero||"").trim();
  const info=o.cidade?await infoCidade(o.cidade,o.uf):null;
  const area=info?{viewbox:info.vb,bounded:"1"}:{};
  // o resultado só vale se o MUNICÍPIO dele for o do cliente (Guarulhos fica dentro da área de São Paulo, por exemplo)
  const naCidade=x=>{
    if(!o.cidade||!info)return true;
    const a=x.address||{},mun=a.city||a.town||a.municipality||a.village||a.county||"";
    return mun?chave(mun)===chave(o.cidade):semAcento(x.display_name||"").includes(semAcento(o.cidade));
  };
  const t=[];
  if(rua&&o.cidade&&/\d/.test(num))t.push(["numero",{q:`${rua}, ${num}, ${o.cidade}`,...area}]);
  if(rua&&o.cidade)t.push(["rua",{q:`${rua}, ${o.cidade}`,...area}]);
  if(dig(o.cep).length===8)t.push(["cep",{postalcode:fmtCep(o.cep)}]);   // sem "area": o CEP já é específico; a conferência da cidade vem abaixo
  for(const[status,p] of t){
    const lista=await nominatimBruto(p);await sleep(1100);   // respeita o limite gratuito do serviço
    const x=lista.find(naCidade);
    if(x)return{lat:+x.lat,lng:+x.lon,status};
  }
  if(info)return{lat:info.lat,lng:info.lng,status:"cidade"};
  return{status:"falhou"};
}
async function buscaCep(cep){
  const d=dig(cep);if(d.length!==8)return null;
  try{const r=await fetch("https://viacep.com.br/ws/"+d+"/json/");const j=await r.json();return j.erro?null:j;}catch(e){return null;}
}

        const upd=r.status==="falhou"?{geo_status:"falhou"}:{lat:r.lat,lng:r.lng,geo_status:r.status};

      d.querySelector("#pgo").hidden=true;d.querySelector("#pcl").textContent="Concluir";

/* ---- matriz de tempos, melhor ordem ---- */
function matrizEstimada(pts){
  const n=pts.length,dist=[],dur=[];
  for(let i=0;i<n;i++){dist.push([]);dur.push([]);for(let j=0;j<n;j++){const km=i===j?0:kmLinha(pts[i],pts[j])*1.3;dist[i].push(km*1000);dur[i].push(km/45*3600);}}
  return{dist,dur,tipo:"estimativa"};
}
/* Tempos e distâncias PELAS RUAS. Ordem de tentativa:
   1) OpenRouteService, pela função rota-ors (só se a chave estiver configurada no Supabase);
   2) OSRM, o serviço público e gratuito do OpenStreetMap (sem chave; uso moderado, sem garantia de disponibilidade);
   3) estimativa pela distância em linha reta. */
let ORS_OFF=false;
const fixaMatriz=(M,E)=>M.map((l,i)=>l.map((x,j)=>(typeof x==="number"?x:E[i][j])));
async function matriz(pts){
  const est=matrizEstimada(pts);
  let motivo="";
  if(!ORS_OFF){
    try{
      const{data,error}=await supa.functions.invoke("rota-ors",{body:{tipo:"matriz",locais:pts.map(p=>[p.lng,p.lat])}});
      if(error)throw error;
      if(data&&data.ok)return{dist:fixaMatriz(data.distancias,est.dist),dur:fixaMatriz(data.duracoes,est.dur),tipo:"ruas",fonte:"ors"};
      if(data&&/n[aã]o configurada/i.test(data.msg||""))ORS_OFF=true;   // sem chave: não insiste nesta sessão
      motivo=(data&&data.msg)||"";
    }catch(e){ORS_OFF=true;}
  }
  try{
    const c=pts.map(p=>p.lng+","+p.lat).join(";");
    const r=await fetch("https://router.project-osrm.org/table/v1/driving/"+c+"?annotations=duration,distance",{cache:"no-store"});
    if(!r.ok)throw new Error("osrm "+r.status);
    const j=await r.json();
    if(j.code!=="Ok"||!j.durations)throw new Error("osrm "+j.code);
    return{dist:fixaMatriz(j.distances,est.dist),dur:fixaMatriz(j.durations,est.dur),tipo:"ruas",fonte:"osrm"};
  }catch(e){return{...est,motivo:motivo||"o serviço de rotas pelas ruas não respondeu"};}
}
async function tracado(seq,fonte){
  try{
    if(fonte==="ors"){
      const{data}=await supa.functions.invoke("rota-ors",{body:{tipo:"rota",locais:seq.map(p=>[p.lng,p.lat])}});
      return data&&data.ok?data.geometria:null;
    }
    await sleep(1100);   // o serviço público pede no máximo 1 consulta por segundo
    const r=await fetch("https://router.project-osrm.org/route/v1/driving/"+seq.map(p=>p.lng+","+p.lat).join(";")+"?overview=full&geometries=geojson",{cache:"no-store"});
    const j=await r.json();
    return j.code==="Ok"&&j.routes&&j.routes[0]?j.routes[0].geometry:null;
  }catch(e){return null;}   // sem traçado: o mapa desenha linhas retas
}
function melhorOrdem(dur,n,voltar){   // 0 = saída; 1..n = paradas
  if(n<=0)return[];
  if(n===1)return[1];
  const custo=ord=>{let c=dur[0][ord[0]];for(let i=0;i<ord.length-1;i++)c+=dur[ord[i]][ord[i+1]];return c+(voltar?dur[ord[ord.length-1]][0]:0);};
  if(n<=15){   // exato (programação dinâmica por subconjuntos)
    const N=1<<n,INF=1e18,dp=new Float64Array(N*n).fill(INF),pai=new Int8Array(N*n).fill(-1);
    for(let i=0;i<n;i++)dp[(1<<i)*n+i]=dur[0][i+1];
    for(let m=1;m<N;m++)for(let l=0;l<n;l++){
      const v=dp[m*n+l];if(v>=INF||!(m&(1<<l)))continue;
      for(let k=0;k<n;k++){if(m&(1<<k))continue;const nm=m|(1<<k),c=v+dur[l+1][k+1];if(c<dp[nm*n+k]){dp[nm*n+k]=c;pai[nm*n+k]=l;}}
    }
    let best=INF,bl=0;const full=N-1;
    for(let l=0;l<n;l++){const c=dp[full*n+l]+(voltar?dur[l+1][0]:0);if(c<best){best=c;bl=l;}}
    const ord=[];let m=full,l=bl;
    while(l>=0){ord.push(l+1);const p=pai[m*n+l];m&=~(1<<l);l=p;}
    return ord.reverse();
  }
  // muitas paradas: vizinho mais próximo + melhoria 2-opt
  let rest=[...Array(n).keys()].map(i=>i+1),ord=[],cur=0;
  while(rest.length){let bi=0;for(let i=1;i<rest.length;i++)if(dur[cur][rest[i]]<dur[cur][rest[bi]])bi=i;cur=rest.splice(bi,1)[0];ord.push(cur);}
  let melhorou=true,voltas=0;
  while(melhorou&&voltas++<50){melhorou=false;
    for(let i=0;i<ord.length-1;i++)for(let j=i+1;j<ord.length;j++){
      const nv=[...ord.slice(0,i),...ord.slice(i,j+1).reverse(),...ord.slice(j+1)];
      if(custo(nv)<custo(ord)-1){ord=nv;melhorou=true;}
    }
  }
  return ord;
}

      ${p.casa_lat!=null?`<p style="margin:0;color:var(--green-500)">Ponto no mapa definido.</p>`:`<p style="margin:0">Ponto no mapa ainda não definido.</p>`}
    </div>
    <div class="card"><h2>Visitas</h2>
      <div class="f"><label for="h_min">Tempo padrão de cada visita (minutos)</label><input id="h_min" inputmode="numeric" value="${esc(p.visita_padrao_min||45)}"><span class="hint">Vale quando o cliente não tem um tempo próprio no cadastro.</span></div>
    </div>
    <div class="actbar"><button class="btn primary" id="h_salvar">Salvar</button><a class="btn sec" href="#/mais">Cancelar</a></div>`;

    set("#h_rua",j.logradouro);set("#h_bairro",j.bairro);set("#h_cid",j.localidade);set("#h_uf",j.uf);
    cm.textContent="Endereço preenchido. Informe o número.";v.querySelector("#h_num").focus();
  };
  v.querySelector("#h_salvar").onclick=async()=>{
    const g=id=>v.querySelector(id).value.trim();
    const msg=(t,tp)=>{v.querySelector("#msg").innerHTML=`<div class="msg ${tp||"err"}">${esc(t)}</div>`;window.scrollTo(0,0);};
    const min=parseInt(g("#h_min"),10);
    if(!(min>=5&&min<=480))return msg("O tempo de visita deve ficar entre 5 e 480 minutos.");
    if(!g("#h_rua")||!g("#h_cid"))return msg("Informe pelo menos a rua e a cidade da sua casa.");
    const b=v.querySelector("#h_salvar");b.disabled=true;b.textContent="Localizando no mapa…";
    try{
      const o={endereco:g("#h_rua"),numero:g("#h_num"),bairro:g("#h_bairro"),cidade:g("#h_cid"),uf:g("#h_uf").toUpperCase(),cep:dig(g("#h_cep"))};
      const r=await localizar(o);
      if(r.status==="falhou"||r.status==="cidade"){b.disabled=false;b.textContent="Salvar";return msg("Não encontramos esse endereço no mapa. Confira a rua, o número e a cidade.");}
      const upd={casa_cep:o.cep,casa_endereco:o.endereco,casa_numero:o.numero,casa_bairro:o.bairro,casa_cidade:o.cidade,casa_uf:o.uf,casa_lat:r.lat,casa_lng:r.lng,visita_padrao_min:min};

    }catch(e){b.disabled=false;b.textContent="Salvar";msg(erroBanco(e));}
  };
}

const STATUS_VIS={agendada:["","Agendada"],realizada:["good","Realizada"],cancelada:["crit","Cancelada"]};
const RESULTADOS=["Visita realizada","Pedido fechado","Pedido em negociação","Sem interesse","Cliente ausente — voltar depois"];
const hhmm=h=>String(h||"").slice(0,5);
const isoLocal=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const somaDias=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return isoLocal(d);};
const dataCurta=iso=>{const p=String(iso||"").split("-");return p.length===3?p[2]+"/"+p[1]:"";};
function rotuloData(iso){
  const h=hojeISO();
  if(iso===h)return"Hoje";if(iso===somaDias(h,1))return"Amanhã";if(iso===somaDias(h,-1))return"Ontem";
  return new Date(iso+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit"});
}
const chaveVis=x=>(x.data||"")+" "+(hhmm(x.hora)||"99:99")+" "+String(x.ordem==null?99:x.ordem).padStart(3,"0");
const visDoCliente=id=>S.visitas.filter(x=>x.cliente_id===id);
const ultimaVisita=id=>visDoCliente(id).filter(x=>x.status==="realizada").sort((a,b)=>String(b.data).localeCompare(String(a.data)))[0]||null;
const proximaVisita=id=>visDoCliente(id).filter(x=>x.status==="agendada"&&x.data>=hojeISO()).sort((a,b)=>chaveVis(a).localeCompare(chaveVis(b)))[0]||null;
const pegaGPS=()=>new Promise(res=>{if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),()=>res(null),{enableHighAccuracy:true,timeout:9000,maximumAge:60000});});

function linhaVisita(x,o){
  o=o||{};const c=cliPorId(x.cliente_id);
  const reps=(x.representadas||[]).map(repNome).filter(Boolean);
  const loc=c?[c.cidade&&(c.cidade+(c.uf?"/"+c.uf:"")),x.assunto].filter(Boolean).join(" · "):"";
  const st=STATUS_VIS[x.status]||["",x.status];
  return `<div class="vis ${x.status==="cancelada"?"cancel":""}" data-vis="${esc(x.id)}"><div class="hr">${o.data?esc(rotuloData(x.data)):(esc(hhmm(x.hora))||"—")}<small>${o.data?(esc(hhmm(x.hora))||"sem hora"):(x.duracao_min?x.duracao_min+" min":"")}</small></div>
    <div class="grow"><div class="t">${esc(c?nomeCli(c):"Cliente removido")}</div><div class="d">${esc(loc)}${o.resultado&&x.resultado?` · ${esc(x.resultado)}`:""}</div>
    <div class="badges">${x.status!=="agendada"||o.status?`<span class="badge ${st[0]}">${st[1]}</span>`:""}${reps.map(n=>`<span class="badge">${esc(n)}</span>`).join("")}</div></div>${IC("chevron-right","sm")}</div>`;
}
const ligaVisitas=root=>root.querySelectorAll("[data-vis]").forEach(e=>e.onclick=()=>abreVisita(e.dataset.vis));

async function gravaVisita(id,campos){
  const q=id?supa.from("rota_visitas").update({...campos,atualizado_em:new Date().toISOString()}).eq("id",id).select().single():supa.from("rota_visitas").insert(campos).select().single();
  const{data,error}=await q;if(error)throw error;
  const i=S.visitas.findIndex(v=>v.id===data.id);if(i>=0)S.visitas[i]=data;else S.visitas.push(data);
  return data;
}

/* ---- detalhes da visita ---- */
function abreVisita(id){
  const x=S.visitas.find(v=>v.id===id);if(!x)return;
  const c=cliPorId(x.cliente_id);
  const reps=(x.representadas||[]).map(repNome).filter(Boolean);
  const st=STATUS_VIS[x.status]||["",x.status];
  const botoes=x.status==="agendada"
    ?`<button class="btn primary" id="vo">${IC("check","sm")} Concluir</button><button class="btn sec" id="ve">Editar</button><button class="btn danger" id="vk">Cancelar visita</button>`
    :x.status==="realizada"
      ?`<button class="btn sec" id="vo">Editar anotações</button><button class="btn sec" id="vr">Voltar para agendada</button>`
      :`<button class="btn primary" id="ve">Reagendar</button>`;
  sheet(`<h2>${esc(c?nomeCli(c):"Cliente removido")}</h2>
    <p>${esc(rotuloData(x.data))}${hhmm(x.hora)?" às "+esc(hhmm(x.hora)):""}${x.duracao_min?" · "+x.duracao_min+" min":""}</p>
    <div class="badges" style="margin:0 0 12px"><span class="badge ${st[0]}">${st[1]}</span>${reps.map(n=>`<span class="badge">${esc(n)}</span>`).join("")}</div>
    ${c?`<p style="margin-bottom:8px">${esc(enderecoLinha(c))||"Sem endereço cadastrado"}</p>`:""}
    ${x.assunto?`<p><b>Assunto:</b> ${esc(x.assunto)}</p>`:""}
    ${x.resultado?`<p><b>Resultado:</b> ${esc(x.resultado)}</p>`:""}
    ${temVenda(x)?`<p><b>Venda:</b> ${esc(textoVendas(x))}</p>`:""}
    ${x.notas?`<p style="white-space:pre-wrap">${esc(x.notas)}</p>`:""}
    <div class="actbar" style="margin-bottom:10px">${botoes}</div>
    <div class="actbar">${c?`<a class="btn sec sm" href="#/clientes/${esc(c.id)}">Abrir cliente</a>`:""}${c&&c.lat!=null?`<a class="btn sec sm" target="_blank" rel="noopener" href="${esc(lnkWaze(c))}">Waze</a><a class="btn sec sm" target="_blank" rel="noopener" href="${esc(lnkMaps(c))}">Google Maps</a>`:""}${hrefWpp(c&&(c.celular||c.tel))?`<a class="btn sec sm" target="_blank" rel="noopener" href="${esc(hrefWpp(c.celular||c.tel))}">WhatsApp</a>`:""}<button class="btn danger sm" id="vd">Excluir</button><button class="btn sec sm" id="vf">Fechar</button></div>`,d=>{
    const q=s=>d.querySelector(s);
    q("#vf").onclick=closeSheet;
    q("#vo")&&(q("#vo").onclick=()=>{closeSheet();concluirVisita(x);});
    q("#ve")&&(q("#ve").onclick=()=>{closeSheet();formVisita(x,null);});
    q("#vk")&&(q("#vk").onclick=()=>{closeSheet();confirma("Cancelar esta visita?","Ela continua no histórico, marcada como cancelada.","Cancelar visita",async()=>{try{await gravaVisita(x.id,{status:"cancelada"});toast("Visita cancelada.");rota();}catch(e){toast(erroBanco(e));}});});
    q("#vr")&&(q("#vr").onclick=async()=>{try{await gravaVisita(x.id,{status:"agendada",realizada_em:null});closeSheet();toast("Visita voltou para agendada.");rota();}catch(e){toast(erroBanco(e));}});
    q("#vd").onclick=()=>{closeSheet();confirma("Excluir esta visita?","Isso apaga a visita e as anotações dela. Não dá para desfazer.","Excluir",async()=>{
      const{error}=await supa.from("rota_visitas").delete().eq("id",x.id);if(error)return toast(erroBanco(error));
      S.visitas=S.visitas.filter(v=>v.id!==x.id);toast("Visita excluída.");rota();});};
  });
}

/* ---- concluir visita ---- */
function concluirVisita(x){
  const c=cliPorId(x.cliente_id);
  // venda (opcional): um campo por empresa da visita; sem empresa, um campo só
  const camposVenda=((x.representadas||[]).length?x.representadas:["_"]).map(id=>`<div class="f"><label for="vd_${id}">Valor vendido${id==="_"?"":" — "+esc(repNome(id))} (R$)</label><input id="vd_${id}" data-vd="${esc(id)}" inputmode="decimal" placeholder="0,00" value="${x.vendas&&+x.vendas[id]>0?esc(money(x.vendas[id])):""}">${id!=="_"&&comRep(id)!=null?`<span class="hint">Comissão combinada: ${esc(String(comRep(id)).replace(".",","))}%</span>`:""}</div>`).join("");
  sheet(`<h2>${x.status==="realizada"?"Anotações da visita":"Concluir visita"}</h2><p>${esc(c?nomeCli(c):"")} · ${esc(rotuloData(x.data))}</p>
    <div class="f"><label for="cr">Como foi?</label><select id="cr">${RESULTADOS.map(r=>`<option ${(x.resultado||RESULTADOS[0])===r?"selected":""}>${esc(r)}</option>`).join("")}</select></div>
    <div class="f"><label for="cn">Anotações</label><textarea id="cn" placeholder="O que foi conversado, pedidos, próximos passos…">${esc(x.notas)}</textarea></div>
    <p style="margin:6px 0 8px"><b>Venda</b> (opcional): só o valor dos produtos, sem frete e instalação. Deixe em branco se não houve venda.</p>${camposVenda}
    ${x.status==="realizada"?"":`<label class="chk"><input type="checkbox" id="cg"> Registrar a minha localização agora (GPS)</label>`}
    <div class="f" style="margin-top:6px"><label for="cp">Agendar a próxima visita em (opcional)</label><input id="cp" type="date"></div>
    <div id="cm"></div><div class="actbar"><button class="btn primary" id="cs2">${x.status==="realizada"?"Salvar":"Concluir"}</button><button class="btn sec" id="cx">Cancelar</button></div>`,d=>{
    const q=s=>d.querySelector(s);
    q("#cx").onclick=closeSheet;
    q("#cs2").onclick=async()=>{
      const b=q("#cs2");b.disabled=true;b.textContent="Salvando…";
      try{
        const campos={resultado:q("#cr").value,notas:q("#cn").value.trim()};
        const vendas={};let invalido=false;
        d.querySelectorAll("[data-vd]").forEach(i=>{const n=parseMoney(i.value);if(Number.isNaN(n))invalido=true;else if(n>0)vendas[i.dataset.vd]=n;});
        if(invalido)throw Object.assign(new Error("O valor da venda está inválido. Use só números, por exemplo 1.500,00."),{validacao:true});
        if(Object.keys(vendas).length||temVenda(x))campos.vendas=vendas;   // só envia o campo quando há venda (ou para limpar uma antiga)
        if(x.status!=="realizada"){campos.status="realizada";campos.realizada_em=new Date().toISOString();}
        if(q("#cg")&&q("#cg").checked){const p=await pegaGPS();if(p){campos.checkin_lat=p.lat;campos.checkin_lng=p.lng;}else toast("Não foi possível pegar a localização. A visita foi concluída assim mesmo.");}
        await gravaVisita(x.id,campos);
        const prox=q("#cp").value;
        if(prox)await gravaVisita(null,{cliente_id:x.cliente_id,data:prox,representadas:x.representadas||[],assunto:x.assunto||""});
        closeSheet();toast(prox?"Visita concluída e próxima agendada.":"Visita concluída.");rota();
      }catch(e){q("#cm").innerHTML=`<div class="msg err">${esc(e&&e.validacao?e.message:erroBanco(e))}</div>`;b.disabled=false;b.textContent=x.status==="realizada"?"Salvar":"Concluir";}
    };
  });
}

/* ---- nova visita / editar ---- */
function formVisita(x,cliId){
  const novo=!x;
  let cli=cliPorId(x?x.cliente_id:cliId)||null;
  const pad=S.perfil.visita_padrao_min||45;
  sheet(`<h2>${novo?"Nova visita":"Editar visita"}</h2>
    <div class="f"><label for="vc">Cliente</label><input id="vc" autocomplete="off" placeholder="Digite o nome do cliente" value="${esc(cli?nomeCli(cli):"")}"><div id="vcl" class="pickbox" hidden></div></div>
    <div class="grid3"><div class="f"><label for="vd">Data</label><input id="vd" type="date" value="${esc(x?x.data:(AG.dia||hojeISO()))}"></div>
      <div class="f"><label for="vh">Hora (opcional)</label><input id="vh" type="time" value="${esc(x?hhmm(x.hora):"")}"></div>
      <div class="f"><label for="vm">Duração (min)</label><input id="vm" inputmode="numeric" value="${x&&x.duracao_min?esc(x.duracao_min):""}" placeholder="${cli&&cli.tempo_visita_min?cli.tempo_visita_min:pad}"></div></div>
    <div class="f"><label>Visita em nome de (marque uma ou mais empresas)</label><div id="vr"></div></div>
    <div class="f"><label for="va">Assunto</label><input id="va" value="${esc(x?x.assunto:"")}" placeholder="Ex.: apresentar a linha nova"></div>
    <div class="f"><label for="vn">Observações</label><textarea id="vn">${esc(x?x.notas:"")}</textarea></div>
    <div id="vmsg"></div><div class="actbar"><button class="btn primary" id="vs">Salvar</button><button class="btn sec" id="vx">Cancelar</button></div>`,d=>{
    const q=s=>d.querySelector(s);
    const desenhaReps=sel=>{
      q("#vr").innerHTML=S.reps.length?S.reps.map(r=>`<label class="chk"><input type="checkbox" data-vr="${esc(r.id)}" ${sel.includes(r.id)?"checked":""}> ${esc(r.nome)}</label>`).join(""):`<p style="margin:0">Você ainda não cadastrou representadas. <a href="#/representadas">Cadastrar agora</a>.</p>`;
    };
    desenhaReps(x?(x.representadas||[]):(cli?(cli.representadas||[]):[]));
    const inp=q("#vc"),box=q("#vcl");
    inp.oninput=()=>{
      if(cli&&inp.value!==nomeCli(cli))cli=null;
      const t=semAcento(inp.value).trim();
      if(!t||cli){box.hidden=true;return;}
      const res=S.clientes.filter(c=>c.ativo).filter(c=>t.split(/\s+/).every(w=>semAcento([c.razao,c.fantasia,c.cidade].join(" ")).includes(w)||(dig(w).length>=3&&dig(c.doc).includes(dig(w))))).slice(0,8);
      box.innerHTML=res.length?res.map(c=>`<button type="button" data-p="${esc(c.id)}">${esc(nomeCli(c))}<small>${esc([c.cidade,c.uf].filter(Boolean).join("/"))}</small></button>`).join(""):`<button type="button" disabled>Nenhum cliente encontrado</button>`;
      box.hidden=false;
      box.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{
        cli=cliPorId(b.dataset.p);inp.value=nomeCli(cli);box.hidden=true;
        q("#vm").placeholder=cli.tempo_visita_min?cli.tempo_visita_min:pad;
        desenhaReps(cli.representadas||[]);
      });
    };
    q("#vx").onclick=closeSheet;
    q("#vs").onclick=async()=>{
      const msg=t=>{q("#vmsg").innerHTML=`<div class="msg err">${esc(t)}</div>`;};
      if(!cli)return msg("Escolha o cliente na lista que aparece ao digitar.");
      const data=q("#vd").value;if(!data)return msg("Escolha a data da visita.");
      const mm=q("#vm").value.trim();const dur=mm===""?null:parseInt(mm,10);
      if(mm!==""&&!(dur>=5&&dur<=480))return msg("A duração deve ficar entre 5 e 480 minutos.");
      const campos={cliente_id:cli.id,data,hora:q("#vh").value||null,duracao_min:dur,representadas:[...d.querySelectorAll("[data-vr]")].filter(i=>i.checked).map(i=>i.dataset.vr),assunto:q("#va").value.trim(),notas:q("#vn").value.trim()};
      if(x&&x.status==="cancelada")campos.status="agendada";
      const b=q("#vs");b.disabled=true;b.textContent="Salvando…";
      try{await gravaVisita(x?x.id:null,campos);AG.dia=data;AG.mes=data.slice(0,7);closeSheet();toast("Visita salva.");rota();}
      catch(e){msg(erroBanco(e));b.disabled=false;b.textContent="Salvar";}
    };
    if(!cli)inp.focus();
  });
}

/* ---- tela da agenda ---- */
let AG={mes:null,dia:null,aba:"dia",rep:""};
function telaAgenda(v){
  const hoje=hojeISO();
  if(!AG.dia)AG.dia=hoje;
  if(!AG.mes)AG.mes=AG.dia.slice(0,7);
  v.innerHTML=`<div class="ph"><div><p class="eyebrow">Agenda</p><h1>Visitas</h1></div><div class="actbar"><button class="btn primary" id="nv">${IC("plus","sm")} Nova visita</button><a class="btn sec" href="#/rota">${IC("route","sm")} Rota do dia</a></div></div>
    ${S.semVisitas?`<div class="msg warn">A agenda ainda não foi ativada no banco. Rode o arquivo <b>supabase-rota-etapa3.sql</b> no SQL Editor do Supabase.</div>`:""}
    ${S.reps.length?`<div class="chips" id="chips"><button class="chip ${AG.rep===""?"on":""}" data-r="">Todas as empresas</button>${S.reps.map(r=>`<button class="chip ${AG.rep===r.id?"on":""}" data-r="${esc(r.id)}">${esc(r.nome)}</button>`).join("")}</div>`:""}
    <div class="agenda"><div class="card" id="cal" style="margin:0"></div><div class="card" id="dia" style="margin:0"></div></div>`;
  const vis=()=>S.visitas.filter(x=>!AG.rep||(x.representadas||[]).includes(AG.rep));
  const desenhaCal=()=>{
    const[Y,M]=AG.mes.split("-").map(Number);
    const dow=(new Date(Y,M-1,1).getDay()+6)%7,ndias=new Date(Y,M,0).getDate(),celulas=Math.ceil((dow+ndias)/7)*7;
    const conta={};vis().filter(x=>x.status!=="cancelada").forEach(x=>{conta[x.data]=(conta[x.data]||0)+1;});
    let html="";
    for(let i=0;i<celulas;i++){
      const d=new Date(Y,M-1,1-dow+i),iso=isoLocal(d),fora=d.getMonth()!==M-1;
      html+=`<button type="button" class="cald ${fora?"fora":""} ${iso===hoje?"hoje":""} ${iso===AG.dia?"sel":""}" data-d="${iso}" aria-label="${esc(rotuloData(iso))}">${d.getDate()}${conta[iso]?`<i>${conta[iso]}</i>`:""}</button>`;
    }
    v.querySelector("#cal").innerHTML=`<div class="calh"><button class="iconbtn" id="calprev" aria-label="Mês anterior">${IC("chevron-left")}</button><b>${esc(new Date(Y,M-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"}))}</b><button class="iconbtn" id="calnext" aria-label="Próximo mês">${IC("chevron-right")}</button></div>
      <div class="calg">${["seg","ter","qua","qui","sex","sáb","dom"].map(s=>`<div class="calw">${s}</div>`).join("")}${html}</div>
      <div class="actbar" style="margin-top:12px"><button class="btn sec sm" id="calhoje">Ir para hoje</button></div>`;
    const mover=n=>{const d=new Date(Y,M-1+n,1);AG.mes=isoLocal(d).slice(0,7);desenhaCal();};
    v.querySelector("#calprev").onclick=()=>mover(-1);v.querySelector("#calnext").onclick=()=>mover(1);
    v.querySelector("#calhoje").onclick=()=>{AG.dia=hoje;AG.mes=hoje.slice(0,7);AG.aba="dia";desenhaCal();desenhaDia();};
    v.querySelectorAll(".cald").forEach(b=>b.onclick=()=>{AG.dia=b.dataset.d;AG.aba="dia";if(AG.dia.slice(0,7)!==AG.mes)AG.mes=AG.dia.slice(0,7);desenhaCal();desenhaDia();});
  };
  const desenhaDia=()=>{
    const abas=[["dia","Dia"],["proximas","Próximas"],["feitas","Realizadas"]];
    let corpo="";
    if(AG.aba==="dia"){
      const doDia=vis().filter(x=>x.data===AG.dia).sort((a,b)=>chaveVis(a).localeCompare(chaveVis(b)));
      corpo=`<div class="sec-h" style="margin:0 0 10px"><h2 class="cap1" style="margin:0">${esc(new Date(AG.dia+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"}))}</h2><a class="btn sec sm" href="#/rota" id="rd">${IC("route","sm")} Rota deste dia</a></div>
        ${doDia.length?`<div class="list">${doDia.map(x=>linhaVisita(x,{status:1})).join("")}</div>`:`<div class="empty"><p>Nenhuma visita neste dia.</p><button class="btn primary" id="nvd">Agendar para este dia</button></div>`}`;
    }else if(AG.aba==="proximas"){
      const lista=vis().filter(x=>x.status==="agendada"&&x.data>=hoje).sort((a,b)=>chaveVis(a).localeCompare(chaveVis(b))).slice(0,80);
      const grupos=[];lista.forEach(x=>{const g=grupos[grupos.length-1];if(g&&g.d===x.data)g.l.push(x);else grupos.push({d:x.data,l:[x]});});
      corpo=lista.length?grupos.map(g=>`<div class="sec-h" style="margin:14px 0 8px"><h2 style="margin:0;font-size:15px">${esc(rotuloData(g.d))} <span style="color:var(--n-500);font-weight:500">· ${esc(dataCurta(g.d))}</span></h2></div><div class="list">${g.l.map(x=>linhaVisita(x)).join("")}</div>`).join(""):`<div class="empty"><p>Nenhuma visita agendada daqui para frente.</p><button class="btn primary" id="nvd">Agendar visita</button></div>`;
      const atr=vis().filter(x=>x.status==="agendada"&&x.data<hoje).sort((a,b)=>chaveVis(a).localeCompare(chaveVis(b)));
      if(atr.length)corpo=`<div class="msg warn" style="margin-bottom:6px">${atr.length} visita${atr.length>1?"s":""} atrasada${atr.length>1?"s":""} (data passada, ainda agendada):</div><div class="list" style="margin-bottom:12px">${atr.map(x=>linhaVisita(x,{data:1})).join("")}</div>`+corpo;
    }else{
      const lista=vis().filter(x=>x.status==="realizada").sort((a,b)=>String(b.realizada_em||b.data).localeCompare(String(a.realizada_em||a.data))).slice(0,80);
      corpo=lista.length?`<div class="list">${lista.map(x=>linhaVisita(x,{data:1,resultado:1})).join("")}</div>`:`<div class="empty"><p>Ainda não há visitas realizadas.</p></div>`;
    }
    v.querySelector("#dia").innerHTML=`<div class="tabs">${abas.map(([k,t])=>`<button class="chip ${AG.aba===k?"on":""}" data-a="${k}">${t}</button>`).join("")}</div>${corpo}`;
    v.querySelectorAll("#dia [data-a]").forEach(b=>b.onclick=()=>{AG.aba=b.dataset.a;desenhaDia();});
    v.querySelector("#nvd")&&(v.querySelector("#nvd").onclick=()=>formVisita(null,null));
    v.querySelector("#rd")&&(v.querySelector("#rd").onclick=()=>{R.data=AG.dia;R.desm=new Set();R.extras=[];R.res=null;});
    ligaVisitas(v.querySelector("#dia"));
  };
  v.querySelector("#nv").onclick=()=>formVisita(null,null);
  v.querySelectorAll("#chips .chip").forEach(b=>b.onclick=()=>{AG.rep=b.dataset.r;v.querySelectorAll("#chips .chip").forEach(x=>x.classList.toggle("on",x===b));desenhaCal();desenhaDia();});
  desenhaCal();desenhaDia();
}

/* ===================== rota do dia (a partir da agenda) ===================== */
let R={data:null,inicio:"08:00",voltar:true,desm:new Set(),extras:[],res:null,calculando:false};
function resumoSaida(){return {endereco:[S.perfil.casa_endereco,S.perfil.casa_numero].filter(Boolean).join(", "),lat:S.perfil.casa_lat,lng:S.perfil.casa_lng};}

async function calcularRota(){
  const casa=resumoSaida();
  const itens=[];
  for(const x of S.visitas.filter(x=>x.data===R.data&&x.status==="agendada"&&!R.desm.has(x.id))){
    const c=cliPorId(x.cliente_id);if(c&&c.lat!=null)itens.push({visita:x,cliente:c});
  }
  let criadas=0;
  for(const cid of R.extras){   // clientes adicionados ao dia viram visitas agendadas
    const c=cliPorId(cid);if(!c||c.lat==null)continue;
    const ja=S.visitas.find(x=>x.cliente_id===cid&&x.data===R.data&&x.status==="agendada");
    if(ja){if(!itens.some(i=>i.visita.id===ja.id))itens.push({visita:ja,cliente:c});continue;}
    const nv=await gravaVisita(null,{cliente_id:cid,data:R.data,representadas:c.representadas||[]});
    itens.push({visita:nv,cliente:c});criadas++;
  }
  R.extras=[];
  if(!itens.length)throw new Error("vazio");
  if(itens.length>25)throw new Error("muitas");
  const pts=[{lat:casa.lat,lng:casa.lng},...itens.map(i=>({lat:i.cliente.lat,lng:i.cliente.lng}))];
  const M=await matriz(pts);
  const ord=melhorOrdem(M.dur,itens.length,R.voltar);
  const padrao=S.perfil.visita_padrao_min||45;
  let t=horaMin(R.inicio),ant=0,km=0,seg=0,visitas=0;const paradas=[];
  ord.forEach((ix,k)=>{
    const it=itens[ix-1];
    km+=M.dist[ant][ix]/1000;seg+=M.dur[ant][ix];t+=M.dur[ant][ix]/60;
    const dur=it.visita.duracao_min||it.cliente.tempo_visita_min||padrao;
    paradas.push({visita_id:it.visita.id,cliente_id:it.cliente.id,ordem:k+1,chegada:Math.round(t),dur,lat:it.cliente.lat,lng:it.cliente.lng});
    t+=dur;visitas+=dur;ant=ix;
  });
  let retorno=null;
  if(R.voltar&&ord.length){km+=M.dist[ant][0]/1000;seg+=M.dur[ant][0];t+=M.dur[ant][0]/60;retorno=Math.round(t);}
  let geometria=null;
  if(M.tipo==="ruas")geometria=await tracado([0,...ord,...(R.voltar?[0]:[])].map(i=>pts[i]),M.fonte);
  R.res={paradas,km,minDirigindo:seg/60,minVisitas:visitas,retorno,saida:Math.round(horaMin(R.inicio)),calculo:M.tipo,motivo:M.motivo||"",geometria,voltar:R.voltar,data:R.data,casa,criadas};
}

// valor da venda: só dos produtos (sem frete e instalação). Guardado por empresa em visita.vendas = {"<id da representada>": valor}
function parseMoney(s){
  const orig=String(s==null?"":s).trim();s=orig.replace(/[^\d.,-]/g,"");
  if(!s)return orig?NaN:null;   // campo vazio = sem venda; texto sem número = valor inválido
  if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");   // "1.234" = mil duzentos e trinta e quatro
  const n=parseFloat(s);return isFinite(n)&&n>=0?Math.round(n*100)/100:NaN;
}
const money=n=>(+n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const comRep=id=>{const r=S.reps.find(x=>x.id===id);return r&&r.comissao!=null?+r.comissao:null;};
const temVenda=x=>Object.values(x.vendas||{}).some(v=>+v>0);
function textoVendas(x){
  return Object.entries(x.vendas||{}).filter(([,v])=>+v>0).map(([k,v])=>(k==="_"?"":repNome(k)+": ")+"R$ "+money(v)).join(" · ");
}
